<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Background -->
  <rect width="800" height="300" rx="16" fill="#1a1b2e"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" fill="#e0e0e0" font-size="21" font-weight="bold">King − Man + Woman = Queen 👑</text>
  <text x="400" y="58" text-anchor="middle" fill="#888" font-size="13">Vector arithmetic captures semantic relationships</text>

  <!-- King vector -->
  <rect x="30" y="90" width="130" height="50" rx="10" fill="#6c5ce7" opacity="0.3" stroke="#6c5ce7" stroke-width="2"/>
  <text x="95" y="112" text-anchor="middle" fill="#a29bfe" font-size="11">royalty + male</text>
  <text x="95" y="130" text-anchor="middle" fill="#a29bfe" font-size="16" font-weight="bold">King</text>

  <!-- Minus -->
  <text x="185" y="122" text-anchor="middle" fill="#e74c3c" font-size="28" font-weight="bold">−</text>

  <!-- Man vector -->
  <rect x="210" y="90" width="130" height="50" rx="10" fill="#e17055" opacity="0.3" stroke="#e17055" stroke-width="2"/>
  <text x="275" y="112" text-anchor="middle" fill="#fab1a0" font-size="11">male</text>
  <text x="275" y="130" text-anchor="middle" fill="#fab1a0" font-size="16" font-weight="bold">Man</text>

  <!-- Equals (intermediate) -->
  <text x="365" y="122" text-anchor="middle" fill="#dfe6e9" font-size="28" font-weight="bold">=</text>

  <!-- Royalty concept -->
  <rect x="390" y="90" width="130" height="50" rx="10" fill="#feca57" opacity="0.2" stroke="#feca57" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="455" y="122" text-anchor="middle" fill="#feca57" font-size="14" font-weight="bold">Royalty ✨</text>

  <!-- Plus -->
  <text x="545" y="122" text-anchor="middle" fill="#00b894" font-size="28" font-weight="bold">+</text>

  <!-- Woman vector -->
  <rect x="570" y="90" width="130" height="50" rx="10" fill="#00b894" opacity="0.3" stroke="#00b894" stroke-width="2"/>
  <text x="635" y="112" text-anchor="middle" fill="#55efc4" font-size="11">female</text>
  <text x="635" y="130" text-anchor="middle" fill="#55efc4" font-size="16" font-weight="bold">Woman</text>

  <!-- Final Equals -->
  <text x="720" y="122" text-anchor="middle" fill="#dfe6e9" font-size="28" font-weight="bold">≈</text>

  <!-- Queen result -->
  <rect x="740" y="85" width="50" height="55" rx="10" fill="#fd79a8" opacity="0.3" stroke="#fd79a8" stroke-width="2"/>
  <text x="765" y="118" text-anchor="middle" fill="#fd79a8" font-size="14" font-weight="bold">👑</text>

  <!-- More examples -->
  <rect x="80" y="170" width="640" height="105" rx="10" fill="#2a2d5a"/>
  <text x="400" y="198" text-anchor="middle" fill="#dfe6e9" font-size="14" font-weight="bold">More examples that actually work:</text>

  <text x="160" y="228" text-anchor="middle" fill="#00b894" font-size="13">Paris − France + Italy</text>
  <text x="160" y="248" text-anchor="middle" fill="#feca57" font-size="14" font-weight="bold">≈ Rome</text>

  <text x="400" y="228" text-anchor="middle" fill="#00b894" font-size="13">bigger − big + small</text>
  <text x="400" y="248" text-anchor="middle" fill="#feca57" font-size="14" font-weight="bold">≈ smaller</text>

  <text x="640" y="228" text-anchor="middle" fill="#00b894" font-size="13">swimming − swim + run</text>
  <text x="640" y="248" text-anchor="middle" fill="#feca57" font-size="14" font-weight="bold">≈ running</text>
</svg>
