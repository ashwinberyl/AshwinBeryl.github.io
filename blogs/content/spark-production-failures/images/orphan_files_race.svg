<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="960" height="350" fill="#ffffff"/>
<text x="480" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">How remove_orphan_files corrupts a table</text>
<text x="480" y="54" text-anchor="middle" font-size="13" fill="#5b6b7a">Illustrative timeline: files exist on disk before the commit that mentions them</text>

<!-- time axis -->
<line x1="150" y1="84" x2="900" y2="84" stroke="#9aa8b4" stroke-width="2"/>
<line x1="170" y1="78" x2="170" y2="90" stroke="#5b6b7a" stroke-width="2"/>
<line x1="450" y1="78" x2="450" y2="90" stroke="#5b6b7a" stroke-width="2"/>
<line x1="750" y1="78" x2="750" y2="90" stroke="#5b6b7a" stroke-width="2"/>
<text x="170" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733">02:00</text>
<text x="450" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733">02:10</text>
<text x="750" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733">02:20</text>

<!-- writer lane -->
<text x="24" y="130" font-size="14" font-weight="700" fill="#1b2733">Writer</text>
<text x="24" y="148" font-size="12" fill="#5b6b7a">daily_load</text>
<rect x="170" y="112" width="560" height="36" rx="6" fill="#a9c8ea"/>
<text x="450" y="135" text-anchor="middle" font-size="13" fill="#1b2733">writing data files (not committed yet, so they look like orphans)</text>
<rect x="740" y="108" width="190" height="44" rx="6" fill="#fbe1de" stroke="#c0392b"/>
<text x="835" y="127" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">commit: S1 to S2</text>
<text x="835" y="143" text-anchor="middle" font-size="12" fill="#c0392b">lists the files</text>

<!-- cleanup lane -->
<text x="24" y="213" font-size="14" font-weight="700" fill="#1b2733">Cleanup</text>
<text x="24" y="231" font-size="12" fill="#5b6b7a">maintenance job</text>
<rect x="330" y="190" width="240" height="56" rx="8" fill="#fff4dc" stroke="#d98e04"/>
<text x="450" y="213" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733">remove_orphan_files</text>
<text x="450" y="233" text-anchor="middle" font-size="12" fill="#1b2733">older_than = now (no margin)</text>
<line x1="450" y1="190" x2="450" y2="152" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4"/>
<text x="462" y="172" font-size="12" font-weight="700" fill="#c0392b">deletes the writer's files</text>

<!-- result -->
<rect x="640" y="190" width="290" height="56" rx="8" fill="#fbe1de" stroke="#c0392b"/>
<text x="785" y="213" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">Table S2 references files</text>
<text x="785" y="233" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">that no longer exist</text>
<line x1="835" y1="152" x2="835" y2="190" stroke="#c0392b" stroke-width="2"/>

<rect x="24" y="274" width="912" height="56" rx="8" fill="#f5f7f9" stroke="#d5dde5"/>
<text x="40" y="297" font-size="13" fill="#1b2733">Every reader now fails with FileNotFoundException. The fix is a margin: older_than longer than your slowest writer</text>
<text x="40" y="317" font-size="13" fill="#1b2733">(Iceberg's default is three days), plus dry_run first. Recovery is rollback_to_snapshot, then replay the idempotent load.</text>
</svg>
