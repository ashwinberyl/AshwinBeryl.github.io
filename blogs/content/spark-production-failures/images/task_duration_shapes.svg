<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Three stages, three shapes of "task duration"</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#5b6b7a">Illustrative shapes only, not measurements. Each bar is one task.</text>

  <g font-size="14" font-weight="700" fill="#1b2733" text-anchor="middle">
    <text x="165" y="86">Healthy</text>
    <text x="450" y="86">One hot key</text>
    <text x="735" y="86">One sick machine</text>
  </g>

  <rect x="30" y="100" width="270" height="200" rx="10" fill="#f4f6f8" stroke="#d0d7de"/>
  <rect x="315" y="100" width="270" height="200" rx="10" fill="#f4f6f8" stroke="#d0d7de"/>
  <rect x="600" y="100" width="270" height="200" rx="10" fill="#f4f6f8" stroke="#d0d7de"/>

  <g fill="#3a78c2">
    <rect x="45" y="115" width="200" height="22" rx="3"/>
    <rect x="45" y="145" width="215" height="22" rx="3"/>
    <rect x="45" y="175" width="190" height="22" rx="3"/>
    <rect x="45" y="205" width="210" height="22" rx="3"/>
    <rect x="45" y="235" width="205" height="22" rx="3"/>
    <rect x="45" y="265" width="195" height="22" rx="3"/>
  </g>
  <g fill="#3a78c2">
    <rect x="330" y="115" width="45" height="22" rx="3"/>
    <rect x="330" y="145" width="40" height="22" rx="3"/>
    <rect x="330" y="175" width="50" height="22" rx="3"/>
    <rect x="330" y="205" width="42" height="22" rx="3"/>
    <rect x="330" y="235" width="48" height="22" rx="3"/>
  </g>
  <rect x="330" y="265" width="240" height="22" rx="3" fill="#d9822b"/>
  <g fill="#3a78c2">
    <rect x="615" y="115" width="120" height="22" rx="3"/>
    <rect x="615" y="145" width="130" height="22" rx="3"/>
    <rect x="615" y="175" width="115" height="22" rx="3"/>
    <rect x="615" y="205" width="125" height="22" rx="3"/>
    <rect x="615" y="235" width="118" height="22" rx="3"/>
  </g>
  <rect x="615" y="265" width="240" height="22" rx="3" fill="#d9822b"/>

  <g font-size="12" fill="#1b2733" text-anchor="middle">
    <text x="165" y="324">Max is close to the median</text>
    <text x="450" y="324">Slow task also READ the most data</text>
    <text x="735" y="324">Slow task read a normal amount</text>
  </g>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <text x="165" y="352" fill="#2f7d4f">Nothing to fix</text>
    <text x="450" y="352" fill="#b25b00">Skew: fix the data shape</text>
    <text x="735" y="352" fill="#b25b00">Environment: fix the machine</text>
  </g>
  <text x="450" y="382" text-anchor="middle" font-size="12" fill="#5b6b7a">Same symptom ("stuck at 199 of 200"), two different cures. Compare input size before you act.</text>
</svg>
