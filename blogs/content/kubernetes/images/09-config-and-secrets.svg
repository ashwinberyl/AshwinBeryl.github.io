<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Same image everywhere: only the paperwork changes">
  <rect width="900" height="360" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e72"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24a4a"/></marker>
  </defs>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Same image everywhere: only the paperwork changes</text>
  <rect x="30" y="62" width="220" height="100" rx="10" fill="#fde3e3" stroke="#c24a4a" stroke-width="1.5"/>
  <text x="140.0" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#7a1f1f">Secret</text>
  <text x="140.0" y="112" text-anchor="middle" font-size="13.5" fill="#1b2733">SECRET_TOKEN=…</text>
  <text x="140.0" y="132" text-anchor="middle" font-size="13.5" fill="#1b2733">base64-encoded, not encrypted</text>
  <text x="140.0" y="150" text-anchor="middle" font-size="12" font-style="italic" fill="#7a1f1f">locked cargo (guard with RBAC)</text>
  <rect x="30" y="200" width="220" height="100" rx="10" fill="#fdecd8" stroke="#d9822b" stroke-width="1.5"/>
  <text x="140.0" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#7a3f00">ConfigMap</text>
  <text x="140.0" y="250" text-anchor="middle" font-size="13.5" fill="#1b2733">GREETING="Welcome"</text>
  <text x="140.0" y="270" text-anchor="middle" font-size="13.5" fill="#1b2733">motd.txt</text>
  <text x="140.0" y="288" text-anchor="middle" font-size="12" font-style="italic" fill="#7a3f00">customs paperwork (plain text)</text>
  <rect x="410" y="55" width="300" height="260" rx="16" fill="#e3edf9" stroke="#3a78c2" stroke-width="2"/>
  <text x="560" y="83" text-anchor="middle" font-size="14.5" font-weight="700" fill="#173d6b">Pod  (image never changes)</text>
  <rect x="430" y="100" width="260" height="85" rx="10" fill="#ffffff" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="560.0" y="126" text-anchor="middle" font-size="13.5" font-weight="700" fill="#173d6b">Environment variables</text>
  <text x="560.0" y="150" text-anchor="middle" font-size="13.5" fill="#1b2733">read once, at container start</text>
  <rect x="430" y="215" width="260" height="85" rx="10" fill="#ffffff" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="560.0" y="241" text-anchor="middle" font-size="13.5" font-weight="700" fill="#173d6b">Files in /etc/port/…</text>
  <text x="560.0" y="265" text-anchor="middle" font-size="13.5" fill="#1b2733">refreshed in place (up to ~1 min)</text>
  <line x1="250" y1="105" x2="430" y2="125" stroke="#c24a4a" stroke-width="2" marker-end="url(#r)"/>
  <text x="340.0" y="107.0" text-anchor="middle" font-size="12" fill="#c24a4a">env</text>
  <line x1="250" y1="225" x2="430" y2="165" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
  <text x="334.0" y="185.0" text-anchor="middle" font-size="12" fill="#1b2733">env</text>
  <line x1="250" y1="270" x2="430" y2="262" stroke="#5b6b7a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="340.0" y="284.0" text-anchor="middle" font-size="12" fill="#1b2733">mounted file</text>
  <text x="795" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733">Change a ConfigMap?</text>
  <text x="795" y="172" text-anchor="middle" font-size="12.5" fill="#7a1f1f">Env vars keep the OLD value</text>
  <text x="795" y="192" text-anchor="middle" font-size="12.5" fill="#7a1f1f">until pods restart:</text>
  <text x="795" y="214" text-anchor="middle" font-size="12" fill="#1b2733">kubectl rollout restart</text>
</svg>
