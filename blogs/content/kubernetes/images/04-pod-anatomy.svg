<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="A pod: containers that share one network and one lifecycle">
  <rect width="900" height="330" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e72"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24a4a"/></marker>
  </defs>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">A pod: containers that share one network and one lifecycle</text>
  <rect x="40" y="60" width="520" height="220" rx="16" fill="#fdecd8" stroke="#d9822b" stroke-width="2"/>
  <text x="300" y="88" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7a3f00">POD   (one IP address: 10.244.1.7)</text>
  <rect x="65" y="110" width="190" height="90" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="160.0" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">app</text>
  <text x="160.0" y="160" text-anchor="middle" font-size="13.5" fill="#1b2733">port-app:v1</text>
  <text x="160.0" y="180" text-anchor="middle" font-size="13.5" fill="#1b2733">listens on :8080</text>
  <rect x="345" y="110" width="190" height="90" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="440.0" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">sidecar</text>
  <text x="440.0" y="160" text-anchor="middle" font-size="13.5" fill="#1b2733">busybox</text>
  <text x="440.0" y="180" text-anchor="middle" font-size="13.5" fill="#1b2733">helper container</text>
  <line x1="255" y1="155" x2="345" y2="155" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="300.0" y="147.0" text-anchor="middle" font-size="12" fill="#1b2733">localhost</text>
  <text x="300" y="235" text-anchor="middle" font-size="13" fill="#7a3f00">shared network  ·  shared volumes (optional)</text>
  <text x="300" y="258" text-anchor="middle" font-size="13" fill="#7a3f00">scheduled together  ·  live and die together</text>
  <rect x="620" y="60" width="240" height="100" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="740.0" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#124d38">Pod managed by a Deployment</text>
  <text x="740.0" y="110" text-anchor="middle" font-size="13.5" fill="#1b2733">dies → replaced</text>
  <rect x="620" y="180" width="240" height="100" rx="10" fill="#fde3e3" stroke="#c24a4a" stroke-width="1.5"/>
  <text x="740.0" y="206" text-anchor="middle" font-size="14" font-weight="700" fill="#7a1f1f">Bare pod</text>
  <text x="740.0" y="230" text-anchor="middle" font-size="13.5" fill="#1b2733">dies → gone for good</text>
  <text x="740.0" y="250" text-anchor="middle" font-size="13.5" fill="#1b2733">new pod = new IP</text>
  <path d="M825,194 L847,216 M847,194 L825,216" stroke="#c24a4a" stroke-width="4" stroke-linecap="round"/>
</svg>
