<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Requests reserve space, limits cap usage, probes check health">
  <rect width="900" height="420" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e72"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24a4a"/></marker>
  </defs>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Requests reserve space, limits cap usage, probes check health</text>
  <text x="30" y="70" text-anchor="start" font-size="12.5" font-weight="700" fill="#5b6b7a">MEMORY OF ONE CONTAINER</text>
  <rect x="30" y="85" width="840" height="46" rx="8" fill="#eef1f4" stroke="#8a97a3"/>
  <rect x="30" y="85" width="280" height="46" rx="8" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <rect x="310" y="85" width="280" height="46" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <rect x="590" y="85" width="280" height="46" rx="8" fill="#fde3e3" stroke="#c24a4a" stroke-width="1.5"/>
  <text x="170" y="114" text-anchor="middle" font-size="13.5" font-weight="700" fill="#173d6b">guaranteed (request 64Mi)</text>
  <text x="450" y="114" text-anchor="middle" font-size="13.5" font-weight="700" fill="#124d38">may burst up to limit 128Mi</text>
  <text x="730" y="114" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a1f1f">never allowed</text>
  <text x="310" y="152" text-anchor="middle" font-size="12.5" fill="#173d6b">scheduler uses the REQUEST to pick a node</text>
  <text x="590" y="152" text-anchor="middle" font-size="12.5" fill="#7a1f1f">kernel enforces the LIMIT</text>
  <rect x="30" y="175" width="410" height="78" rx="10" fill="#fdecd8" stroke="#d9822b" stroke-width="1.5"/>
  <text x="235.0" y="201" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7a3f00">Over the CPU limit</text>
  <text x="235.0" y="225" text-anchor="middle" font-size="13.5" fill="#1b2733">throttled: slower but alive</text>
  <rect x="460" y="175" width="410" height="78" rx="10" fill="#fde3e3" stroke="#c24a4a" stroke-width="1.5"/>
  <text x="665.0" y="201" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7a1f1f">Over the memory limit</text>
  <text x="665.0" y="225" text-anchor="middle" font-size="13.5" fill="#1b2733">OOMKilled: container restarted</text>
  <text x="30" y="288" text-anchor="start" font-size="12.5" font-weight="700" fill="#5b6b7a">PROBES: HOW KUBERNETES KNOWS A POD IS HEALTHY</text>
  <rect x="30" y="302" width="270" height="92" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="165.0" y="328" text-anchor="middle" font-size="14.5" font-weight="700" fill="#173d6b">Startup</text>
  <text x="165.0" y="352" text-anchor="middle" font-size="13.5" fill="#1b2733">booted yet?</text>
  <text x="165.0" y="372" text-anchor="middle" font-size="13.5" fill="#1b2733">no → keep waiting</text>
  <rect x="315" y="302" width="270" height="92" rx="10" fill="#fdecd8" stroke="#d9822b" stroke-width="1.5"/>
  <text x="450.0" y="328" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7a3f00">Readiness</text>
  <text x="450.0" y="352" text-anchor="middle" font-size="13.5" fill="#1b2733">can it take traffic now?</text>
  <text x="450.0" y="372" text-anchor="middle" font-size="13.5" fill="#1b2733">no → removed from the Service</text>
  <rect x="600" y="302" width="270" height="92" rx="10" fill="#fde3e3" stroke="#c24a4a" stroke-width="1.5"/>
  <text x="735.0" y="328" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7a1f1f">Liveness</text>
  <text x="735.0" y="352" text-anchor="middle" font-size="13.5" fill="#1b2733">still alive, or stuck?</text>
  <text x="735.0" y="372" text-anchor="middle" font-size="13.5" fill="#1b2733">no → container restarted</text>
</svg>
