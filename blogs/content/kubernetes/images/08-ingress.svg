<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Ingress: one gate, many destinations, routed by URL path">
  <rect width="900" height="360" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e72"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24a4a"/></marker>
  </defs>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Ingress: one gate, many destinations, routed by URL path</text>
  <rect x="20" y="140" width="140" height="80" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="90.0" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">Browser</text>
  <text x="90.0" y="190" text-anchor="middle" font-size="13.5" fill="#1b2733">localhost:8080</text>
  <rect x="220" y="110" width="190" height="140" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="315.0" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#173d6b">Ingress controller</text>
  <text x="315.0" y="160" text-anchor="middle" font-size="13.5" fill="#1b2733">the guard (nginx pod)</text>
  <text x="315.0" y="180" text-anchor="middle" font-size="13.5" fill="#1b2733">reads the Ingress rules:</text>
  <text x="315.0" y="200" text-anchor="middle" font-size="13.5" fill="#1b2733">/cargo → cargo</text>
  <text x="315.0" y="220" text-anchor="middle" font-size="13.5" fill="#1b2733">/passengers → passengers</text>
  <line x1="160" y1="180" x2="220" y2="180" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="410" y1="150" x2="500" y2="100" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
  <text x="447.0" y="113.0" text-anchor="middle" font-size="12" fill="#1b2733">/cargo</text>
  <line x1="410" y1="215" x2="500" y2="265" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
  <text x="437.0" y="260.0" text-anchor="middle" font-size="12" fill="#1b2733">/passengers</text>
  <rect x="500" y="60" width="170" height="80" rx="10" fill="#fdecd8" stroke="#d9822b" stroke-width="1.5"/>
  <text x="585.0" y="86" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7a3f00">Service cargo</text>
  <text x="585.0" y="110" text-anchor="middle" font-size="13.5" fill="#1b2733">ClusterIP :80</text>
  <rect x="500" y="225" width="170" height="80" rx="10" fill="#fdecd8" stroke="#d9822b" stroke-width="1.5"/>
  <text x="585.0" y="251" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7a3f00">Service passengers</text>
  <text x="585.0" y="275" text-anchor="middle" font-size="13.5" fill="#1b2733">ClusterIP :80</text>
  <line x1="670" y1="100" x2="720" y2="100" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="670" y1="265" x2="720" y2="265" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
  <rect x="720" y="60" width="150" height="80" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="795.0" y="86" text-anchor="middle" font-size="14.5" font-weight="700" fill="#124d38">cargo pods</text>
  <text x="795.0" y="110" text-anchor="middle" font-size="13.5" fill="#1b2733">× 2</text>
  <rect x="720" y="225" width="150" height="80" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="795.0" y="251" text-anchor="middle" font-size="14.5" font-weight="700" fill="#124d38">passengers pods</text>
  <text x="795.0" y="275" text-anchor="middle" font-size="13.5" fill="#1b2733">× 2</text>
  <text x="450" y="345" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5b6b7a">No controller installed = the rules just sit there. Ingress is the rulebook; the controller is the guard.</text>
</svg>
