<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Access badges: a ServiceAccount can do only what its Role lists">
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e72"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24a4a"/></marker>
  </defs>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Access badges: a ServiceAccount can do only what its Role lists</text>
  <rect x="20" y="150" width="170" height="100" rx="10" fill="#ece6f7" stroke="#7b5cb8" stroke-width="1.5"/>
  <text x="105.0" y="176" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3d2a6b">ServiceAccount</text>
  <text x="105.0" y="200" text-anchor="middle" font-size="13.5" fill="#1b2733">dockhand</text>
  <text x="105.0" y="220" text-anchor="middle" font-size="13.5" fill="#1b2733">(a badge for a bot)</text>
  <line x1="190" y1="200" x2="270" y2="200" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
  <text x="230.0" y="192.0" text-anchor="middle" font-size="12" fill="#1b2733">bound by</text>
  <rect x="270" y="150" width="200" height="100" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="370.0" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#173d6b">RoleBinding → Role</text>
  <text x="370.0" y="200" text-anchor="middle" font-size="13.5" fill="#1b2733">pod-reader:</text>
  <text x="370.0" y="220" text-anchor="middle" font-size="13.5" fill="#1b2733">get, list, watch pods</text>
  <rect x="560" y="55" width="310" height="140" rx="14" fill="#f7f9fc" stroke="#2f9e72" stroke-width="2"/>
  <text x="715" y="80" text-anchor="middle" font-size="13.5" font-weight="700" fill="#124d38">namespace: port-dev</text>
  <rect x="580" y="95" width="270" height="34" rx="17.0" fill="#dff3ea" stroke="#2f9e72"/>
  <text x="715.0" y="116.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#124d38">list pods</text>
  <rect x="580" y="140" width="270" height="34" rx="17.0" fill="#fde3e3" stroke="#c24a4a"/>
  <text x="715.0" y="161.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a1f1f">delete pods  /  read secrets</text>
  <path d="M590,112 L595.3333333333334,118.4 L606,105.6" fill="none" stroke="#2f9e72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M590,149 L606,165 M606,149 L590,165" stroke="#c24a4a" stroke-width="4" stroke-linecap="round"/>
  <rect x="560" y="215" width="310" height="85" rx="14" fill="#f7f9fc" stroke="#c24a4a" stroke-width="2"/>
  <text x="715" y="240" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a1f1f">namespace: port-prod</text>
  <rect x="580" y="252" width="270" height="34" rx="17.0" fill="#fde3e3" stroke="#c24a4a"/>
  <text x="715.0" y="273.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a1f1f">anything at all</text>
  <path d="M590,261 L606,277 M606,261 L590,277" stroke="#c24a4a" stroke-width="4" stroke-linecap="round"/>
  <line x1="470" y1="190" x2="560" y2="120" stroke="#2f9e72" stroke-width="2" marker-end="url(#g)"/>
  <line x1="470" y1="215" x2="560" y2="250" stroke="#c24a4a" stroke-width="2" marker-end="url(#r)"/>
  <text x="450" y="345" text-anchor="middle" font-size="13" font-style="italic" fill="#5b6b7a">RBAC is deny-by-default: a Role is a whitelist, scoped to one namespace.</text>
  <text x="450" y="372" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b2733">Locked containers: runAsNonRoot · readOnlyRootFilesystem · drop ALL capabilities</text>
</svg>
