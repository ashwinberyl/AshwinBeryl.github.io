<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Kubernetes keeps closing the gap between what you want and what exists">
  <rect width="900" height="330" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e72"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24a4a"/></marker>
  </defs>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Kubernetes keeps closing the gap between what you want and what exists</text>
  <rect x="40" y="70" width="220" height="110" rx="10" fill="#fdecd8" stroke="#d9822b" stroke-width="1.5"/>
  <text x="150.0" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#7a3f00">Desired state</text>
  <text x="150.0" y="120" text-anchor="middle" font-size="13.5" fill="#1b2733">Your standing order:</text>
  <text x="150.0" y="140" text-anchor="middle" font-size="13.5" fill="#1b2733">"keep 3 copies of web"</text>
  <text x="150.0" y="168" text-anchor="middle" font-size="12" font-style="italic" fill="#7a3f00">what you write</text>
  <rect x="340" y="70" width="220" height="110" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="450.0" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">Control loop</text>
  <text x="450.0" y="120" text-anchor="middle" font-size="13.5" fill="#1b2733">compare desired</text>
  <text x="450.0" y="140" text-anchor="middle" font-size="13.5" fill="#1b2733">with actual, forever</text>
  <text x="450.0" y="168" text-anchor="middle" font-size="12" font-style="italic" fill="#173d6b">the harbour master</text>
  <rect x="640" y="70" width="220" height="110" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="750.0" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">Actual state</text>
  <text x="750.0" y="120" text-anchor="middle" font-size="13.5" fill="#1b2733">what is really running:</text>
  <text x="750.0" y="140" text-anchor="middle" font-size="13.5" fill="#1b2733">2 copies of web</text>
  <text x="750.0" y="168" text-anchor="middle" font-size="12" font-style="italic" fill="#2b3945">what exists right now</text>
  <line x1="260" y1="125" x2="340" y2="125" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
  <text x="300.0" y="117.0" text-anchor="middle" font-size="12" fill="#1b2733">reads</text>
  <line x1="640" y1="125" x2="560" y2="125" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
  <text x="600.0" y="117.0" text-anchor="middle" font-size="12" fill="#1b2733">observes</text>
  <line x1="450" y1="180" x2="450" y2="232" stroke="#2f9e72" stroke-width="2" marker-end="url(#g)"/>
  <text x="512.0" y="210.0" text-anchor="middle" font-size="12" fill="#2f9e72">gap found: 3 ≠ 2</text>
  <rect x="310" y="236" width="280" height="70" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="450.0" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#124d38">Start one more pod</text>
  <text x="450.0" y="294" text-anchor="middle" font-size="12" font-style="italic" fill="#124d38">gap closed: 3 = 3</text>
  <text x="450" y="322" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5b6b7a">Declare the outcome once. The loop repairs drift continuously.</text>
</svg>
