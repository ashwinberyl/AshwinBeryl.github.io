<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 455" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="The harbour master's office: every part talks through the API server">
  <rect width="900" height="455" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e72"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24a4a"/></marker>
  </defs>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">The harbour master's office: every part talks through the API server</text>
  <rect x="170" y="55" width="700" height="224" rx="14" fill="#f7f9fc" stroke="#3a78c2" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="520" y="78" text-anchor="middle" font-size="12.5" font-weight="700" fill="#173d6b">CONTROL PLANE (the office)</text>
  <rect x="20" y="110" width="120" height="70" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="80.0" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">You</text>
  <text x="80.0" y="160" text-anchor="middle" font-size="13.5" fill="#1b2733">kubectl</text>
  <rect x="335" y="90" width="190" height="92" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="430.0" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">API server</text>
  <text x="430.0" y="140" text-anchor="middle" font-size="13.5" fill="#1b2733">the front desk,</text>
  <text x="430.0" y="160" text-anchor="middle" font-size="13.5" fill="#1b2733">the only door in</text>
  <rect x="335" y="204" width="190" height="60" rx="10" fill="#fdecd8" stroke="#d9822b" stroke-width="1.5"/>
  <text x="430.0" y="230" text-anchor="middle" font-size="15" font-weight="700" fill="#7a3f00">etcd</text>
  <text x="430.0" y="254" text-anchor="middle" font-size="13.5" fill="#1b2733">the ledger</text>
  <rect x="590" y="88" width="130" height="56" rx="10" fill="#ece6f7" stroke="#7b5cb8" stroke-width="1.5"/>
  <text x="655.0" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#3d2a6b">Scheduler</text>
  <text x="655.0" y="138" text-anchor="middle" font-size="13.5" fill="#1b2733">picks a node</text>
  <rect x="590" y="154" width="130" height="56" rx="10" fill="#ece6f7" stroke="#7b5cb8" stroke-width="1.5"/>
  <text x="655.0" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#3d2a6b">Controllers</text>
  <text x="655.0" y="204" text-anchor="middle" font-size="13.5" fill="#1b2733">fix drift</text>
  <line x1="140" y1="135" x2="335" y2="135" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
  <text x="237.5" y="127.0" text-anchor="middle" font-size="12" fill="#1b2733">request</text>
  <line x1="430" y1="182" x2="430" y2="204" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="590" y1="116" x2="525" y2="116" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="557.5" y="108.0" text-anchor="middle" font-size="12" fill="#1b2733">watch</text>
  <line x1="590" y1="156" x2="525" y2="156" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="557.5" y="148.0" text-anchor="middle" font-size="12" fill="#1b2733">watch</text>
  <text x="790" y="112" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5b6b7a">Nobody calls</text>
  <text x="790" y="130" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5b6b7a">anybody directly:</text>
  <text x="790" y="148" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5b6b7a">everyone reads and</text>
  <text x="790" y="166" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5b6b7a">writes through the</text>
  <text x="790" y="184" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5b6b7a">API server.</text>
  <rect x="180" y="320" width="250" height="105" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="305.0" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">Worker node</text>
  <text x="305.0" y="370" text-anchor="middle" font-size="13.5" fill="#1b2733">kubelet = crane operator</text>
  <text x="305.0" y="390" text-anchor="middle" font-size="13.5" fill="#1b2733">starts the containers</text>
  <text x="305.0" y="410" text-anchor="middle" font-size="13.5" fill="#1b2733">kube-proxy = local signals</text>
  <rect x="470" y="320" width="250" height="105" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="595.0" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">Worker node</text>
  <text x="595.0" y="370" text-anchor="middle" font-size="13.5" fill="#1b2733">kubelet = crane operator</text>
  <text x="595.0" y="390" text-anchor="middle" font-size="13.5" fill="#1b2733">starts the containers</text>
  <text x="595.0" y="410" text-anchor="middle" font-size="13.5" fill="#1b2733">kube-proxy = local signals</text>
  <line x1="380" y1="279" x2="330" y2="320" stroke="#2f9e72" stroke-width="2" marker-end="url(#g)"/>
  <text x="303.0" y="297.5" text-anchor="middle" font-size="12" fill="#2f9e72">assignments</text>
  <line x1="480" y1="279" x2="560" y2="320" stroke="#2f9e72" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#g)"/>
  <text x="568.0" y="297.5" text-anchor="middle" font-size="12" fill="#2f9e72">status back</text>
</svg>
