<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="A Service: one stable address in front of pods that keep changing">
  <rect width="900" height="340" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e72"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24a4a"/></marker>
  </defs>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">A Service: one stable address in front of pods that keep changing</text>
  <rect x="30" y="125" width="130" height="80" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="95.0" y="151" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">Caller</text>
  <text x="95.0" y="175" text-anchor="middle" font-size="13.5" fill="#1b2733">another pod,</text>
  <text x="95.0" y="195" text-anchor="middle" font-size="13.5" fill="#1b2733">or you</text>
  <rect x="260" y="100" width="230" height="130" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="375.0" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">Service  port-app</text>
  <text x="375.0" y="150" text-anchor="middle" font-size="13.5" fill="#1b2733">stable IP 10.96.0.15</text>
  <text x="375.0" y="170" text-anchor="middle" font-size="13.5" fill="#1b2733">DNS name: port-app</text>
  <text x="375.0" y="190" text-anchor="middle" font-size="13.5" fill="#1b2733">selector: app=web</text>
  <text x="375.0" y="218" text-anchor="middle" font-size="12" font-style="italic" fill="#173d6b">a rule on every node, not a process</text>
  <line x1="160" y1="165" x2="260" y2="165" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
  <text x="210.0" y="157.0" text-anchor="middle" font-size="12" fill="#1b2733">port 80</text>
  <rect x="610" y="60" width="250" height="60" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="735.0" y="86" text-anchor="middle" font-size="13.5" font-weight="700" fill="#124d38">pod  web   10.244.1.5</text>
  <line x1="490" y1="165" x2="610" y2="90" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
  <rect x="610" y="140" width="250" height="60" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="735.0" y="166" text-anchor="middle" font-size="13.5" font-weight="700" fill="#124d38">pod  web   10.244.2.9</text>
  <line x1="490" y1="165" x2="610" y2="170" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
  <rect x="610" y="220" width="250" height="60" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="735.0" y="246" text-anchor="middle" font-size="13.5" font-weight="700" fill="#124d38">pod  web   10.244.1.8</text>
  <line x1="490" y1="165" x2="610" y2="250" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
  <text x="735" y="51" text-anchor="middle" font-size="12.5" font-style="italic" fill="#124d38">ready pods matching app=web</text>
  <text x="735" y="300" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5b6b7a">Pod dies → new IP → endpoint list updates.</text>
  <text x="735" y="320" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5b6b7a">The Service address never changes.</text>
</svg>
