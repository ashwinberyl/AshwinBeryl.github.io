<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Storage: data on a claimed volume outlives the pod that wrote it">
  <rect width="900" height="380" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e72"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24a4a"/></marker>
  </defs>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Storage: data on a claimed volume outlives the pod that wrote it</text>
  <rect x="30" y="70" width="190" height="90" rx="10" fill="#fde3e3" stroke="#c24a4a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="125.0" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#7a1f1f">Pod A</text>
  <text x="125.0" y="120" text-anchor="middle" font-size="13.5" fill="#1b2733">writes visits.log</text>
  <text x="125.0" y="140" text-anchor="middle" font-size="13.5" fill="#1b2733">dies / is replaced</text>
  <path d="M181,86 L199,104 M199,86 L181,104" stroke="#c24a4a" stroke-width="4" stroke-linecap="round"/>
  <rect x="30" y="230" width="190" height="90" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="125.0" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">Pod B (new)</text>
  <text x="125.0" y="280" text-anchor="middle" font-size="13.5" fill="#1b2733">mounts the same claim</text>
  <text x="125.0" y="300" text-anchor="middle" font-size="13.5" fill="#1b2733">finds visits.log</text>
  <rect x="330" y="135" width="180" height="100" rx="10" fill="#fdecd8" stroke="#d9822b" stroke-width="1.5"/>
  <text x="420.0" y="161" text-anchor="middle" font-size="15" font-weight="700" fill="#7a3f00">PVC</text>
  <text x="420.0" y="185" text-anchor="middle" font-size="13.5" fill="#1b2733">"I need 100Mi,</text>
  <text x="420.0" y="205" text-anchor="middle" font-size="13.5" fill="#1b2733">one writer"</text>
  <text x="420.0" y="223" text-anchor="middle" font-size="12" font-style="italic" fill="#7a3f00">the request (yours)</text>
  <line x1="220" y1="115" x2="330" y2="170" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
  <text x="275.0" y="136.5" text-anchor="middle" font-size="12" fill="#1b2733">mount</text>
  <line x1="220" y1="275" x2="330" y2="205" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
  <text x="275.0" y="254.0" text-anchor="middle" font-size="12" fill="#1b2733">mount again</text>
  <line x1="510" y1="185" x2="600" y2="185" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
  <text x="555.0" y="177.0" text-anchor="middle" font-size="12" fill="#1b2733">bound to</text>
  <path d="M610,150 v90 a100,28 0 0 0 200,0 v-90" fill="#e3edf9" stroke="#3a78c2" stroke-width="2"/>
  <ellipse cx="710" cy="150" rx="100" ry="28" fill="#e3edf9" stroke="#3a78c2" stroke-width="2"/>
  <text x="710" y="206" text-anchor="middle" font-size="14.5" font-weight="700" fill="#173d6b">PV: the real disk</text>
  <text x="710" y="228" text-anchor="middle" font-size="13" fill="#1b2733">survives the pod</text>
  <text x="710" y="298" text-anchor="middle" font-size="12" font-style="italic" fill="#5b6b7a">created automatically by a StorageClass</text>
  <text x="450" y="358" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5b6b7a">emptyDir = scratch space that dies with the pod.  StatefulSet = one PVC per pod (data-vault-0, data-vault-1…).</text>
</svg>
