<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="430" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Salting with K = 2: split the hot key, copy the small side</text>

  <g font-size="14" font-weight="700" text-anchor="middle" fill="#173d6b">
    <text x="125" y="80">events (big side)</text>
    <text x="395" y="80">events + salt</text>
    <text x="735" y="80">actors, exploded x2</text>
  </g>

  <!-- column 1 -->
  <rect x="40" y="140" width="170" height="40" rx="6" fill="#fbe3dc" stroke="#c0452b" stroke-width="2"/>
  <rect x="40" y="240" width="170" height="40" rx="6" fill="#ffffff" stroke="#3a78c2" stroke-width="1.5"/>
  <g font-size="13" text-anchor="middle" fill="#1b2733">
    <text x="125" y="165">dave: 5 rows</text>
    <text x="125" y="265">jim: 3 rows</text>
  </g>

  <!-- column 2 -->
  <g stroke-width="1.5" fill="#ffffff" stroke="#3a78c2">
    <rect x="290" y="110" width="210" height="40" rx="6"/>
    <rect x="290" y="170" width="210" height="40" rx="6"/>
    <rect x="290" y="230" width="210" height="40" rx="6"/>
    <rect x="290" y="290" width="210" height="40" rx="6"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#1b2733">
    <text x="395" y="135">dave/0: e02, e04</text>
    <text x="395" y="195">dave/1: e01, e03, e05</text>
    <text x="395" y="255">jim/0: e06, e08</text>
    <text x="395" y="315">jim/1: e07</text>
  </g>
  <g stroke="#5b6b7a" stroke-width="1.8" marker-end="url(#a)">
    <line x1="210" y1="155" x2="288" y2="132"/>
    <line x1="210" y1="165" x2="288" y2="188"/>
    <line x1="210" y1="255" x2="288" y2="252"/>
    <line x1="210" y1="265" x2="288" y2="308"/>
  </g>

  <!-- column 3 -->
  <g stroke-width="1.5" fill="#ffffff" stroke="#d9822b">
    <rect x="640" y="110" width="190" height="40" rx="6"/>
    <rect x="640" y="170" width="190" height="40" rx="6"/>
    <rect x="640" y="230" width="190" height="40" rx="6"/>
    <rect x="640" y="290" width="190" height="40" rx="6"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#1b2733">
    <text x="735" y="135">dave/0: platform</text>
    <text x="735" y="195">dave/1: platform</text>
    <text x="735" y="255">jim/0: web</text>
    <text x="735" y="315">jim/1: web</text>
  </g>
  <g stroke="#5b6b7a" stroke-width="1.8" marker-start="url(#b)" marker-end="url(#a)">
    <line x1="502" y1="130" x2="638" y2="130"/>
    <line x1="502" y1="190" x2="638" y2="190"/>
    <line x1="502" y1="250" x2="638" y2="250"/>
    <line x1="502" y1="310" x2="638" y2="310"/>
  </g>
  <text x="570" y="352" text-anchor="middle" font-size="13" fill="#5b6b7a">join on (actor_login, salt)</text>

  <text x="450" y="392" text-anchor="middle" font-size="14" fill="#1b2733">Biggest group on the big side: 5 rows down to 3. The small side: 2 rows up to 4.</text>
  <text x="450" y="414" text-anchor="middle" font-size="14" fill="#1b2733">Eight events in, eight rows out.</text>
</svg>
