<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="900" height="360" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker></defs>
<text x="450" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">coalesce(1) squeezes the whole stage. repartition(1) adds a shuffle.</text><text x="30" y="80" font-size="15" font-weight="700" fill="#173d6b">coalesce(1)</text><rect x="30" y="95" width="520" height="70" rx="6" fill="#fbe3dc" stroke="#c0452b" stroke-width="1.5"/><text x="290.0" y="135.0" text-anchor="middle" font-size="14" fill="#1b2733">ONE stage, ONE task: read, parse, join, then write</text><text x="570" y="135" font-size="13" fill="#1b2733">No Exchange. The upstream work</text><text x="570" y="153" font-size="13" fill="#1b2733">loses its parallelism too.</text><text x="30" y="215" font-size="15" font-weight="700" fill="#173d6b">repartition(1)</text><rect x="30" y="235" width="60" height="50" rx="6" fill="#e8f1fb" stroke="#3a78c2" stroke-width="1.5"/><text x="60.0" y="265.0" text-anchor="middle" font-size="13" fill="#1b2733">t1</text><rect x="100" y="235" width="60" height="50" rx="6" fill="#e8f1fb" stroke="#3a78c2" stroke-width="1.5"/><text x="130.0" y="265.0" text-anchor="middle" font-size="13" fill="#1b2733">t2</text><rect x="170" y="235" width="60" height="50" rx="6" fill="#e8f1fb" stroke="#3a78c2" stroke-width="1.5"/><text x="200.0" y="265.0" text-anchor="middle" font-size="13" fill="#1b2733">t3</text><rect x="240" y="235" width="60" height="50" rx="6" fill="#e8f1fb" stroke="#3a78c2" stroke-width="1.5"/><text x="270.0" y="265.0" text-anchor="middle" font-size="13" fill="#1b2733">t4</text><text x="150" y="312" text-anchor="middle" font-size="12" fill="#5b6b7a">Stage 1: many tasks in parallel</text><line x1="315" y1="260" x2="400" y2="260" stroke="#5b6b7a" stroke-width="1.5" marker-end="url(#a)"/><text x="357" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2733">Exchange</text><rect x="405" y="235" width="120" height="50" rx="6" fill="#ffffff" stroke="#3a78c2" stroke-width="1.5"/><text x="465.0" y="265.0" text-anchor="middle" font-size="13" fill="#1b2733">1 task writes</text><text x="465" y="312" text-anchor="middle" font-size="12" fill="#5b6b7a">Stage 2: one writer</text><text x="570" y="255" font-size="13" fill="#1b2733">Same single file, but the heavy</text><text x="570" y="273" font-size="13" fill="#1b2733">work stays parallel.</text></svg>