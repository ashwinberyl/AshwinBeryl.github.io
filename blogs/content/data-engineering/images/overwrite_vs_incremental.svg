<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="960" height="380" fill="#ffffff"/>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
</defs>
<text x="480" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Same batch 2, two different tables</text>
<text x="480" y="54" text-anchor="middle" font-size="13" fill="#5b6b7a">Both approaches give the same result when you re-run. Only one keeps the data.</text>

<rect x="24" y="76" width="450" height="284" rx="8" fill="#fbeed6" stroke="#8f5300"/>
<text x="42" y="102" font-size="12" font-weight="700" fill="#8f5300">OVERWRITE THE PARTITIONS IT TOUCHES</text>
<text x="42" y="124" font-size="15" font-weight="700" fill="#1b2733">overwritePartitions()</text>

<rect x="42" y="142" width="414" height="52" rx="6" fill="#ffffff" stroke="#e1c48f"/>
<text x="56" y="164" font-size="13" fill="#1b2733">After batch 1: 5 rows</text>
<text x="56" y="182" font-size="12" fill="#5b6b7a">e01, e02, e03, e04, e05 (all 2024-03-01)</text>
<path d="M249 196 V212" stroke="#5b6b7a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<rect x="42" y="214" width="414" height="52" rx="6" fill="#ffffff" stroke="#e1c48f"/>
<text x="56" y="236" font-size="13" fill="#1b2733">Batch 2 touches 03-01 and 03-02</text>
<text x="56" y="254" font-size="12" fill="#5b6b7a">both partitions are replaced by the batch alone</text>
<path d="M249 268 V284" stroke="#5b6b7a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<rect x="42" y="286" width="414" height="52" rx="6" fill="#ffffff" stroke="#8f5300" stroke-width="1.5"/>
<text x="56" y="308" font-size="13" font-weight="700" fill="#8f5300">Result: 7 rows. e01, e02, e03 are gone</text>
<text x="56" y="326" font-size="12" fill="#5b6b7a">re-running changes nothing, but the data is wrong</text>

<rect x="486" y="76" width="450" height="284" rx="8" fill="#dde9f7" stroke="#1d5fa8"/>
<text x="504" y="102" font-size="12" font-weight="700" fill="#1d5fa8">ADD ONLY WHAT IS NEW</text>
<text x="504" y="124" font-size="15" font-weight="700" fill="#1b2733">dedupe + anti join + append</text>

<rect x="504" y="142" width="414" height="52" rx="6" fill="#ffffff" stroke="#8fb3de"/>
<text x="518" y="164" font-size="13" fill="#1b2733">After batch 1: 5 rows</text>
<text x="518" y="182" font-size="12" fill="#5b6b7a">e01, e02, e03, e04, e05 (all 2024-03-01)</text>
<path d="M711 196 V212" stroke="#5b6b7a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<rect x="504" y="214" width="414" height="52" rx="6" fill="#ffffff" stroke="#8fb3de"/>
<text x="518" y="236" font-size="13" fill="#1b2733">Batch 2: anti join keeps e06 to e10</text>
<text x="518" y="254" font-size="12" fill="#5b6b7a">e04 and e05 match stored ids and are dropped</text>
<path d="M711 268 V284" stroke="#5b6b7a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<rect x="504" y="286" width="414" height="52" rx="6" fill="#ffffff" stroke="#1d5fa8" stroke-width="1.5"/>
<text x="518" y="308" font-size="13" font-weight="700" fill="#1d5fa8">Result: 10 rows. Nothing lost</text>
<text x="518" y="326" font-size="12" fill="#5b6b7a">re-running adds 0 rows, and the data is right</text>
</svg>
