<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="960" height="360" fill="#ffffff"/>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
</defs>
<text x="480" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Four steps between a batch and the table</text>
<text x="480" y="54" text-anchor="middle" font-size="13" fill="#5b6b7a">Row counts for RepoSphere batch 2 (7 lines: e04 to e10)</text>

<rect x="150" y="76" width="170" height="78" rx="8" fill="#dde9f7" stroke="#1d5fa8"/>
<text x="235" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="#1d5fa8">1 · DEDUPE</text>
<text x="235" y="124" text-anchor="middle" font-size="13" fill="#1b2733">dropDuplicates</text>
<text x="235" y="141" text-anchor="middle" font-size="12" fill="#5b6b7a">inside the batch</text>

<rect x="350" y="76" width="170" height="78" rx="8" fill="#dde9f7" stroke="#1d5fa8"/>
<text x="435" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="#1d5fa8">2 · ANTI JOIN</text>
<text x="435" y="124" text-anchor="middle" font-size="13" fill="#1b2733">drop stored event_ids</text>
<text x="435" y="141" text-anchor="middle" font-size="12" fill="#5b6b7a">what is really new</text>

<rect x="550" y="76" width="170" height="78" rx="8" fill="#dde9f7" stroke="#1d5fa8"/>
<text x="635" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="#1d5fa8">3 · ALIGN</text>
<text x="635" y="124" text-anchor="middle" font-size="13" fill="#1b2733">match table columns</text>
<text x="635" y="141" text-anchor="middle" font-size="12" fill="#5b6b7a">typed NULLs, no extras</text>

<rect x="750" y="76" width="170" height="78" rx="8" fill="#ffffff" stroke="#1d5fa8" stroke-width="1.5"/>
<text x="835" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="#1d5fa8">4 · WRITE</text>
<text x="835" y="124" text-anchor="middle" font-size="13" fill="#1b2733">add the new rows</text>
<text x="835" y="141" text-anchor="middle" font-size="12" fill="#5b6b7a">return the count</text>

<path d="M320 115 H346" stroke="#5b6b7a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<path d="M520 115 H546" stroke="#5b6b7a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<path d="M720 115 H746" stroke="#5b6b7a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

<text x="24" y="196" font-size="13" font-weight="700" fill="#1b2733">First run</text>
<text x="24" y="214" font-size="12" fill="#5b6b7a">table holds e01-e05</text>
<rect x="150" y="176" width="170" height="48" rx="6" fill="#dde9f7" stroke="#8fb3de"/>
<text x="235" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2733">7 rows</text>
<rect x="350" y="176" width="170" height="48" rx="6" fill="#dde9f7" stroke="#8fb3de"/>
<text x="435" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2733">5 rows</text>
<rect x="550" y="176" width="170" height="48" rx="6" fill="#dde9f7" stroke="#8fb3de"/>
<text x="635" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2733">5 rows</text>
<rect x="750" y="176" width="170" height="48" rx="6" fill="#dde9f7" stroke="#1d5fa8" stroke-width="1.5"/>
<text x="835" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#1d5fa8">5 inserted</text>

<text x="24" y="268" font-size="13" font-weight="700" fill="#1b2733">Re-run</text>
<text x="24" y="286" font-size="12" fill="#5b6b7a">table holds e01-e10</text>
<rect x="150" y="248" width="170" height="48" rx="6" fill="#fbeed6" stroke="#e1c48f"/>
<text x="235" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2733">7 rows</text>
<rect x="350" y="248" width="170" height="48" rx="6" fill="#fbeed6" stroke="#e1c48f"/>
<text x="435" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#8f5300">0 rows</text>
<rect x="550" y="248" width="170" height="48" rx="6" fill="#fbeed6" stroke="#e1c48f"/>
<text x="635" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#8f5300">0 rows</text>
<rect x="750" y="248" width="170" height="48" rx="6" fill="#fbeed6" stroke="#8f5300" stroke-width="1.5"/>
<text x="835" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#8f5300">0 inserted</text>

<text x="480" y="334" text-anchor="middle" font-size="13" fill="#5b6b7a">e04 and e05 are replays from batch 1. The anti join removes them. On the re-run it removes everything.</text>
</svg>
