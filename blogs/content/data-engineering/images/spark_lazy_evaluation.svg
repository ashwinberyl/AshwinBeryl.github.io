<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="330" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Lazy evaluation: transformations write the order, actions cook it</text>

  <!-- transformations: dashed recipe cards -->
  <g font-size="13">
    <rect x="25" y="70" width="150" height="70" rx="8" fill="#f5f8fc" stroke="#3a78c2" stroke-dasharray="6 4"/>
    <text x="100" y="98" text-anchor="middle" font-weight="700" fill="#173d6b">withColumn</text>
    <text x="100" y="118" text-anchor="middle" fill="#1b2733">lower(event_type)</text>

    <rect x="200" y="70" width="150" height="70" rx="8" fill="#f5f8fc" stroke="#3a78c2" stroke-dasharray="6 4"/>
    <text x="275" y="98" text-anchor="middle" font-weight="700" fill="#173d6b">filter</text>
    <text x="275" y="118" text-anchor="middle" fill="#1b2733">login is not null</text>

    <rect x="375" y="70" width="150" height="70" rx="8" fill="#f5f8fc" stroke="#3a78c2" stroke-dasharray="6 4"/>
    <text x="450" y="98" text-anchor="middle" font-weight="700" fill="#173d6b">drop</text>
    <text x="450" y="118" text-anchor="middle" fill="#1b2733">created_at</text>

    <rect x="550" y="70" width="150" height="70" rx="8" fill="#dff3ea" stroke="#2f9e72" stroke-width="2"/>
    <text x="625" y="98" text-anchor="middle" font-weight="700" fill="#14583d">show()</text>
    <text x="625" y="118" text-anchor="middle" fill="#14583d">ACTION</text>

    <rect x="725" y="70" width="150" height="70" rx="8" fill="#fdecd8" stroke="#d9822b"/>
    <text x="800" y="98" text-anchor="middle" font-weight="700" fill="#7a3f00">Spark runs</text>
    <text x="800" y="118" text-anchor="middle" fill="#7a3f00">the whole plan</text>
  </g>
  <g stroke="#5b6b7a" stroke-width="2" fill="none">
    <path d="M175 105 H196" marker-end="url(#a)"/><path d="M350 105 H371" marker-end="url(#a)"/>
    <path d="M525 105 H546" marker-end="url(#a)"/><path d="M700 105 H721" marker-end="url(#a)"/>
  </g>

  <!-- bracket labels -->
  <path d="M25 160 V172 H525 V160" stroke="#3a78c2" stroke-width="2" fill="none"/>
  <text x="275" y="195" text-anchor="middle" font-size="14" font-weight="700" fill="#173d6b">Transformations: return instantly, touch no data</text>
  <text x="275" y="215" text-anchor="middle" font-size="13" fill="#5b6b7a">Each one just adds a step to the plan</text>

  <path d="M550 160 V172 H875 V160" stroke="#2f9e72" stroke-width="2" fill="none"/>
  <text x="712" y="195" text-anchor="middle" font-size="14" font-weight="700" fill="#14583d">Action: now the data is read</text>
  <text x="712" y="215" text-anchor="middle" font-size="13" fill="#5b6b7a">show · count · collect · write</text>

  <rect x="25" y="245" width="850" height="64" rx="8" fill="#f7f7f7" stroke="#d6dbe0"/>
  <text x="450" y="271" text-anchor="middle" font-size="14" fill="#1b2733">Because Spark sees the whole plan before running it, it can optimise:</text>
  <text x="450" y="293" text-anchor="middle" font-size="14" fill="#1b2733">filter early, skip columns you dropped, and read each file only once.</text>
</svg>
