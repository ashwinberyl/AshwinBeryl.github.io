<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="920" height="440" fill="#ffffff"/>
<text x="460" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">sessionize_actor_events: islands of activity, split by gaps &gt; 1800 s</text>
<text x="460" y="52" text-anchor="middle" font-size="13" fill="#5b6b7a">Each dot is one event. A capsule is one session. Gap labels are the time since that actor's previous event.</text>
<g stroke="#e1e6ec">
<line x1="110" y1="70" x2="110" y2="380"/><line x1="230" y1="70" x2="230" y2="380"/><line x1="350" y1="70" x2="350" y2="380"/><line x1="470" y1="70" x2="470" y2="380"/><line x1="590" y1="70" x2="590" y2="380"/><line x1="710" y1="70" x2="710" y2="380"/><line x1="830" y1="70" x2="830" y2="380"/>
</g>
<text x="20" y="155" font-size="15" font-weight="700" fill="#1b2733">dave</text>
<text x="20" y="275" font-size="15" font-weight="700" fill="#1b2733">jim</text>
<text x="20" y="355" font-size="13" font-weight="700" fill="#8a96a3">null</text>
<text x="20" y="371" font-size="11" fill="#8a96a3">(actor 3)</text>
<!-- dave islands -->
<rect x="170" y="132" width="240" height="36" rx="18" fill="#cfe2f7" stroke="#3a78c2"/>
<rect x="528" y="132" width="44" height="36" rx="18" fill="#bfe6d4" stroke="#2f9e72"/>
<text x="290" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#173d6b">session 1</text>
<text x="550" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#14583d">session 2</text>
<circle cx="190" cy="150" r="7" fill="#1b2733"/><circle cx="270" cy="150" r="7" fill="#1b2733"/><circle cx="390" cy="150" r="7" fill="#1b2733"/>
<circle cx="546" cy="150" r="7" fill="#1b2733"/><circle cx="554" cy="150" r="7" fill="#1b2733" stroke="#ffffff" stroke-width="1.5"/>
<g font-size="11.5" fill="#1b2733" font-family="DejaVu Sans Mono, Consolas, monospace" text-anchor="middle">
<text x="190" y="124">e01</text><text x="270" y="124">e02</text><text x="390" y="124">e03</text><text x="550" y="124">e04 e05</text>
</g>
<!-- dave gaps -->
<g font-size="12" text-anchor="middle">
<text x="230" y="101" fill="#5b6b7a">20 min</text>
<text x="330" y="86" fill="#b0560f" font-weight="700">30 min = 1800 s</text>
<text x="330" y="101" fill="#b0560f">not &gt; 1800, stays</text>
<text x="470" y="86" fill="#c0392b" font-weight="700">40 min</text>
<text x="470" y="101" fill="#c0392b">new session</text>
</g>
<line x1="410" y1="150" x2="528" y2="150" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
<!-- jim islands -->
<rect x="270" y="252" width="120" height="36" rx="18" fill="#cfe2f7" stroke="#3a78c2"/>
<rect x="808" y="252" width="44" height="36" rx="18" fill="#bfe6d4" stroke="#2f9e72"/>
<text x="330" y="310" text-anchor="middle" font-size="13" font-weight="700" fill="#173d6b">session 1</text>
<text x="830" y="310" text-anchor="middle" font-size="13" font-weight="700" fill="#14583d">session 2</text>
<circle cx="290" cy="270" r="7" fill="#1b2733"/><circle cx="370" cy="270" r="7" fill="#1b2733"/><circle cx="830" cy="270" r="7" fill="#1b2733"/>
<g font-size="11.5" fill="#1b2733" font-family="DejaVu Sans Mono, Consolas, monospace" text-anchor="middle">
<text x="290" y="244">e06</text><text x="370" y="244">e07</text><text x="830" y="244">e08</text>
</g>
<g font-size="12" text-anchor="middle">
<text x="330" y="222" fill="#5b6b7a">20 min</text>
<text x="600" y="256" fill="#c0392b" font-weight="700">115 min = 6900 s</text>
<text x="600" y="291" fill="#c0392b">new session</text>
</g>
<line x1="390" y1="270" x2="808" y2="270" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
<!-- e09 dropped -->
<circle cx="230" cy="352" r="7" fill="#ffffff" stroke="#8a96a3" stroke-width="2" stroke-dasharray="3 2"/>
<line x1="222" y1="344" x2="238" y2="360" stroke="#c0392b" stroke-width="2"/><line x1="238" y1="344" x2="222" y2="360" stroke="#c0392b" stroke-width="2"/>
<text x="250" y="349" font-size="12" fill="#5b6b7a" font-family="DejaVu Sans Mono, Consolas, monospace">e09</text>
<text x="250" y="365" font-size="12" fill="#5b6b7a">no actor_login: filtered out before the window</text>
<!-- axis -->
<line x1="100" y1="384" x2="880" y2="384" stroke="#5b6b7a"/>
<g font-size="12" fill="#5b6b7a" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace">
<text x="110" y="402">09:30</text><text x="230" y="402">10:00</text><text x="350" y="402">10:30</text><text x="470" y="402">11:00</text><text x="590" y="402">11:30</text><text x="710" y="402">12:00</text><text x="830" y="402">12:30</text>
</g>
<text x="460" y="428" text-anchor="middle" font-size="12" fill="#5b6b7a">All times 2024-03-01, UTC. e04 and e05 share 11:20:00; event_id puts e04 first.</text>
</svg>
