<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="900" height="340" fill="#ffffff"/>
<text x="450" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Where the time goes (a schematic, not a measurement)</text>
<text x="30" y="78" font-size="15" font-weight="700" fill="#173d6b">9-event sample</text>
<rect x="30" y="90" width="800" height="50" rx="6" fill="#d9dee3" stroke="#8a97a3" stroke-width="1.5"/>
<text x="430" y="121" text-anchor="middle" font-size="15" fill="#1b2733">Fixed cost: planning, scheduling tasks, JVM warm-up, listing files</text>
<rect x="830" y="90" width="8" height="50" fill="#3a78c2"/>
<text x="838" y="160" text-anchor="end" font-size="13" fill="#5b6b7a">the only part tuning can change</text>
<text x="30" y="212" font-size="15" font-weight="700" fill="#173d6b">1 billion events</text>
<rect x="30" y="224" width="30" height="50" rx="4" fill="#d9dee3" stroke="#8a97a3" stroke-width="1.5"/>
<rect x="62" y="224" width="808" height="50" rx="6" fill="#e8f1fb" stroke="#3a78c2" stroke-width="1.5"/>
<text x="466" y="255" text-anchor="middle" font-size="15" fill="#1b2733">Work that grows with the rows: read, shuffle, sort, write</text>
<text x="30" y="296" font-size="13" fill="#5b6b7a">fixed cost, now a sliver</text>
<text x="450" y="326" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2733">Tuning changes the blue. A 9-row run only ever shows you the grey.</text>
</svg>
