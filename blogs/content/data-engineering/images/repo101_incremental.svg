<line x1="140" y1="248" x2="910" y2="248" stroke="#5b6b7a"/>
<line x1="140" y1="244" x2="140" y2="252" stroke="#5b6b7a"/><text x="140" y="270" text-anchor="middle" font-size="12" fill="#5b6b7a">09:00</text>
