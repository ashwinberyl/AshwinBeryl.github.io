<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">How Spark splits one job across many machines</text>

  <!-- driver -->
  <rect x="285" y="55" width="330" height="78" rx="10" fill="#fdecd8" stroke="#d9822b"/>
  <text x="450" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="#7a3f00">Driver  (the head chef)</text>
  <text x="450" y="102" text-anchor="middle" font-size="13" fill="#3b2a1a">Runs your Python code, builds the plan,</text>
  <text x="450" y="120" text-anchor="middle" font-size="13" fill="#3b2a1a">hands out tasks, collects results</text>

  <g stroke="#5b6b7a" stroke-width="2" fill="none">
    <path d="M360 133 L170 178" marker-end="url(#a)"/>
    <path d="M450 133 V178" marker-end="url(#a)"/>
    <path d="M540 133 L730 178" marker-end="url(#a)"/>
  </g>
  <text x="600" y="165" font-size="12" fill="#5b6b7a">tasks</text>

  <!-- executors -->
  <g font-size="13">
    <rect x="50" y="182" width="240" height="150" rx="10" fill="#e3edf9" stroke="#3a78c2"/>
    <text x="170" y="205" text-anchor="middle" font-weight="700" fill="#173d6b">Executor 1  (a cook)</text>
    <rect x="70" y="220" width="200" height="44" rx="6" fill="#ffffff" stroke="#3a78c2"/>
    <text x="170" y="240" text-anchor="middle" font-weight="700" fill="#1b2733">Partition 1</text>
    <text x="170" y="256" text-anchor="middle" font-size="12" fill="#5b6b7a">e01 · e02 · e03</text>
    <rect x="70" y="274" width="200" height="44" rx="6" fill="#ffffff" stroke="#3a78c2"/>
    <text x="170" y="294" text-anchor="middle" font-weight="700" fill="#1b2733">Partition 4</text>
    <text x="170" y="310" text-anchor="middle" font-size="12" fill="#5b6b7a">… billions more rows …</text>

    <rect x="330" y="182" width="240" height="150" rx="10" fill="#e3edf9" stroke="#3a78c2"/>
    <text x="450" y="205" text-anchor="middle" font-weight="700" fill="#173d6b">Executor 2  (a cook)</text>
    <rect x="350" y="220" width="200" height="44" rx="6" fill="#ffffff" stroke="#3a78c2"/>
    <text x="450" y="240" text-anchor="middle" font-weight="700" fill="#1b2733">Partition 2</text>
    <text x="450" y="256" text-anchor="middle" font-size="12" fill="#5b6b7a">e05 · e04 · e06</text>
    <rect x="350" y="274" width="200" height="44" rx="6" fill="#ffffff" stroke="#3a78c2"/>
    <text x="450" y="294" text-anchor="middle" font-weight="700" fill="#1b2733">Partition 5</text>
    <text x="450" y="310" text-anchor="middle" font-size="12" fill="#5b6b7a">… billions more rows …</text>

    <rect x="610" y="182" width="240" height="150" rx="10" fill="#e3edf9" stroke="#3a78c2"/>
    <text x="730" y="205" text-anchor="middle" font-weight="700" fill="#173d6b">Executor 3  (a cook)</text>
    <rect x="630" y="220" width="200" height="44" rx="6" fill="#ffffff" stroke="#3a78c2"/>
    <text x="730" y="240" text-anchor="middle" font-weight="700" fill="#1b2733">Partition 3</text>
    <text x="730" y="256" text-anchor="middle" font-size="12" fill="#5b6b7a">e07 · e08 · e09</text>
    <rect x="630" y="274" width="200" height="44" rx="6" fill="#ffffff" stroke="#3a78c2"/>
    <text x="730" y="294" text-anchor="middle" font-weight="700" fill="#1b2733">Partition 6</text>
    <text x="730" y="310" text-anchor="middle" font-size="12" fill="#5b6b7a">… billions more rows …</text>
  </g>

  <text x="450" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#173d6b">One DataFrame = all partitions together. You write code once; every executor runs it on its slice.</text>
  <text x="450" y="388" text-anchor="middle" font-size="13" fill="#5b6b7a">On your laptop with master("local[*]"), the driver and executors are just threads on one machine.</text>
</svg>
