<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="960" height="400" fill="#ffffff"/>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
</defs>
<text x="480" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">One Iceberg commit: batch 2 lands in events</text>
<text x="480" y="54" text-anchor="middle" font-size="13" fill="#5b6b7a">Steps 1 and 2 are invisible to readers. Only step 3 changes what anyone sees.</text>

<g>
  <rect x="24" y="78" width="280" height="104" rx="8" fill="#f5f7f9" stroke="#b9c6d3"/>
  <text x="40" y="102" font-size="12" font-weight="700" fill="#5b6b7a">STEP 1</text>
  <text x="40" y="124" font-size="15" font-weight="700" fill="#1b2733">Write data files</text>
  <text x="40" y="146" font-size="13" fill="#1b2733">e06 … e10 → new Parquet files</text>
  <text x="40" y="166" font-size="13" fill="#5b6b7a">Nothing points at them yet</text>

  <rect x="340" y="78" width="280" height="104" rx="8" fill="#f5f7f9" stroke="#b9c6d3"/>
  <text x="356" y="102" font-size="12" font-weight="700" fill="#5b6b7a">STEP 2</text>
  <text x="356" y="124" font-size="15" font-weight="700" fill="#1b2733">Write new metadata</text>
  <text x="356" y="146" font-size="13" fill="#1b2733">manifest, manifest list,</text>
  <text x="356" y="166" font-size="13" fill="#1b2733">metadata.json for snapshot S2</text>

  <rect x="656" y="78" width="280" height="104" rx="8" fill="#dde9f7" stroke="#1d5fa8" stroke-width="1.6"/>
  <text x="672" y="102" font-size="12" font-weight="700" fill="#1d5fa8">STEP 3 · THE COMMIT</text>
  <text x="672" y="124" font-size="15" font-weight="700" fill="#1b2733">Swap the catalog pointer</text>
  <text x="672" y="146" font-size="13" fill="#1b2733">S1's metadata → S2's metadata</text>
  <text x="672" y="166" font-size="13" fill="#5b6b7a">one atomic compare-and-swap</text>
</g>
<path d="M304 130 H336" stroke="#5b6b7a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<path d="M620 130 H652" stroke="#5b6b7a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

<text x="24" y="218" font-size="13" font-weight="700" fill="#1b2733">If the job dies right after this step…</text>
<g>
  <rect x="24" y="232" width="280" height="96" rx="8" fill="#fbeed6" stroke="#d9a441"/>
  <text x="40" y="256" font-size="13" font-weight="700" fill="#8f5300">Nothing changed</text>
  <text x="40" y="278" font-size="13" fill="#1b2733">Readers still see S1: 5 rows</text>
  <text x="40" y="298" font-size="13" fill="#1b2733">New files are orphans</text>
  <text x="40" y="318" font-size="13" fill="#1b2733">Re-running is safe</text>

  <rect x="340" y="232" width="280" height="96" rx="8" fill="#fbeed6" stroke="#d9a441"/>
  <text x="356" y="256" font-size="13" font-weight="700" fill="#8f5300">Nothing changed</text>
  <text x="356" y="278" font-size="13" fill="#1b2733">Readers still see S1: 5 rows</text>
  <text x="356" y="298" font-size="13" fill="#1b2733">Orphan files + unused metadata</text>
  <text x="356" y="318" font-size="13" fill="#1b2733">Re-running is safe</text>

  <rect x="656" y="232" width="280" height="96" rx="8" fill="#d8f0e4" stroke="#2f9e72"/>
  <text x="672" y="256" font-size="13" font-weight="700" fill="#14583d">Committed</text>
  <text x="672" y="278" font-size="13" fill="#1b2733">New readers see S2: 10 rows</text>
  <text x="672" y="298" font-size="13" fill="#1b2733">Queries already running</text>
  <text x="672" y="318" font-size="13" fill="#1b2733">finish on S1, undisturbed</text>
</g>
<text x="480" y="370" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2733">There is no moment when a reader can see "half of batch 2".</text>
</svg>
