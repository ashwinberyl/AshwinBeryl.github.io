<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="960" height="440" fill="#ffffff"/>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
</defs>
<text x="480" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Compaction merges files inside a partition, never across</text>
<text x="480" y="54" text-anchor="middle" font-size="13" fill="#5b6b7a">events with min-input-files = 2. File counts are illustrative.</text>

<text x="215" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2733">BEFORE: 4 data files</text>
<text x="745" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2733">AFTER: 2 data files</text>

<rect x="40" y="108" width="350" height="140" rx="8" fill="#f5f7f9" stroke="#b9c6d3"/>
<text x="56" y="132" font-size="13" font-weight="700" fill="#5b6b7a">PARTITION 2024-03-01</text>
<rect x="56" y="148" width="98" height="52" rx="4" fill="#a9c8ea" stroke="#1d5fa8"/>
<text x="105" y="170" text-anchor="middle" font-size="12" fill="#1b2733">file A</text>
<text x="105" y="188" text-anchor="middle" font-size="11" fill="#5b6b7a">3 rows</text>
<rect x="162" y="148" width="98" height="52" rx="4" fill="#a9c8ea" stroke="#1d5fa8"/>
<text x="211" y="170" text-anchor="middle" font-size="12" fill="#1b2733">file B</text>
<text x="211" y="188" text-anchor="middle" font-size="11" fill="#5b6b7a">2 rows</text>
<rect x="268" y="148" width="98" height="52" rx="4" fill="#a9c8ea" stroke="#1d5fa8"/>
<text x="317" y="170" text-anchor="middle" font-size="12" fill="#1b2733">file C</text>
<text x="317" y="188" text-anchor="middle" font-size="11" fill="#5b6b7a">1 row (e06)</text>
<text x="56" y="228" font-size="12" fill="#5b6b7a">3 files ≥ 2, so this group is rewritten</text>

<rect x="40" y="272" width="350" height="110" rx="8" fill="#f5f7f9" stroke="#b9c6d3"/>
<text x="56" y="296" font-size="13" font-weight="700" fill="#5b6b7a">PARTITION 2024-03-02</text>
<rect x="56" y="310" width="98" height="40" rx="4" fill="#a9c8ea" stroke="#1d5fa8"/>
<text x="105" y="328" text-anchor="middle" font-size="12" fill="#1b2733">file D</text>
<text x="105" y="343" text-anchor="middle" font-size="11" fill="#5b6b7a">4 rows</text>
<text x="56" y="370" font-size="12" fill="#5b6b7a">1 file &lt; 2, so it is left alone</text>

<path d="M404 245 H556" stroke="#5b6b7a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<text x="480" y="236" text-anchor="middle" font-size="12" font-weight="700" fill="#1d5fa8">rewrite_data_files</text>
<text x="480" y="266" text-anchor="middle" font-size="11" fill="#5b6b7a">new snapshot: replace</text>

<rect x="570" y="108" width="350" height="140" rx="8" fill="#f5f7f9" stroke="#b9c6d3"/>
<text x="586" y="132" font-size="13" font-weight="700" fill="#5b6b7a">PARTITION 2024-03-01</text>
<rect x="586" y="148" width="318" height="52" rx="4" fill="#dde9f7" stroke="#1d5fa8" stroke-width="1.6"/>
<text x="745" y="170" text-anchor="middle" font-size="12" fill="#1b2733">file E (A + B + C combined)</text>
<text x="745" y="188" text-anchor="middle" font-size="11" fill="#5b6b7a">6 rows</text>
<text x="586" y="228" font-size="12" fill="#5b6b7a">same rows, one file</text>

<rect x="570" y="272" width="350" height="110" rx="8" fill="#f5f7f9" stroke="#b9c6d3"/>
<text x="586" y="296" font-size="13" font-weight="700" fill="#5b6b7a">PARTITION 2024-03-02</text>
<rect x="586" y="310" width="98" height="40" rx="4" fill="#a9c8ea" stroke="#1d5fa8"/>
<text x="635" y="328" text-anchor="middle" font-size="12" fill="#1b2733">file D</text>
<text x="635" y="343" text-anchor="middle" font-size="11" fill="#5b6b7a">4 rows</text>
<text x="586" y="370" font-size="12" fill="#5b6b7a">untouched</text>

<text x="480" y="418" text-anchor="middle" font-size="13" fill="#5b6b7a">Rows: 10 before, 10 after. Files A, B and C are still on disk, kept alive by the old snapshots.</text>
</svg>
