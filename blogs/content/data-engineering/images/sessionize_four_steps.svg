<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="920" height="380" fill="#ffffff"/>
<text x="460" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">The gaps-and-islands recipe: four steps, one window</text>
<text x="460" y="52" text-anchor="middle" font-size="13" fill="#5b6b7a">Dave's five events, column by column. Step 0 (drop null actors) runs first.</text>
<g font-size="14" font-weight="700" text-anchor="middle">
<rect x="20" y="72" width="200" height="50" rx="8" fill="#e8f0fa" stroke="#3a78c2"/><text x="120" y="95" fill="#173d6b">1 · Order</text><text x="120" y="113" font-size="11.5" font-weight="400" fill="#173d6b">created_ts, event_id</text>
<rect x="245" y="72" width="200" height="50" rx="8" fill="#fdf0e2" stroke="#d9822b"/><text x="345" y="95" fill="#7a3f00">2 · Look back</text><text x="345" y="113" font-size="11.5" font-weight="400" fill="#7a3f00">lag, gap in seconds</text>
<rect x="470" y="72" width="200" height="50" rx="8" fill="#fbe3e0" stroke="#c0392b"/><text x="570" y="95" fill="#8e2a20">3 · Flag</text><text x="570" y="113" font-size="11.5" font-weight="400" fill="#8e2a20">first row or gap &gt; 1800</text>
<rect x="695" y="72" width="200" height="50" rx="8" fill="#e3f4ec" stroke="#2f9e72"/><text x="795" y="95" fill="#14583d">4 · Number</text><text x="795" y="113" font-size="11.5" font-weight="400" fill="#14583d">running sum of flags</text>
</g>
<g stroke="#5b6b7a" stroke-width="1.5"><line x1="220" y1="97" x2="243" y2="97"/><line x1="445" y1="97" x2="468" y2="97"/><line x1="670" y1="97" x2="693" y2="97"/></g>
<g font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" fill="#1b2733">
<text x="30" y="156" font-weight="700" fill="#5b6b7a">event</text><text x="110" y="156" font-weight="700" fill="#5b6b7a">created_ts</text>
<text x="255" y="156" font-weight="700" fill="#5b6b7a">prev_ts</text><text x="345" y="156" font-weight="700" fill="#5b6b7a">gap_s</text>
<text x="480" y="156" font-weight="700" fill="#5b6b7a">is_new_session</text>
<text x="705" y="156" font-weight="700" fill="#5b6b7a">session_id</text>
<text x="30" y="186">e01</text><text x="110" y="186">09:50</text><text x="255" y="186">null</text><text x="345" y="186">null</text><text x="480" y="186" fill="#c0392b" font-weight="700">1 (first row)</text><text x="705" y="186">1</text>
<text x="30" y="216">e02</text><text x="110" y="216">10:10</text><text x="255" y="216">09:50</text><text x="345" y="216">1200.0</text><text x="480" y="216">0</text><text x="705" y="216">1</text>
<text x="30" y="246">e03</text><text x="110" y="246">10:40</text><text x="255" y="246">10:10</text><text x="345" y="246" fill="#b0560f" font-weight="700">1800.0</text><text x="480" y="246">0 (not &gt; 1800)</text><text x="705" y="246">1</text>
<text x="30" y="276">e04</text><text x="110" y="276">11:20</text><text x="255" y="276">10:40</text><text x="345" y="276">2400.0</text><text x="480" y="276" fill="#c0392b" font-weight="700">1 (gap &gt; 1800)</text><text x="705" y="276" font-weight="700" fill="#14583d">2</text>
<text x="30" y="306">e05</text><text x="110" y="306">11:20</text><text x="255" y="306">11:20</text><text x="345" y="306">0.0</text><text x="480" y="306">0</text><text x="705" y="306" font-weight="700" fill="#14583d">2</text>
</g>
<g stroke="#e1e6ec"><line x1="20" y1="166" x2="895" y2="166"/><line x1="20" y1="196" x2="895" y2="196"/><line x1="20" y1="226" x2="895" y2="226"/><line x1="20" y1="256" x2="895" y2="256"/><line x1="20" y1="286" x2="895" y2="286"/><line x1="20" y1="316" x2="895" y2="316"/></g>
<text x="460" y="348" text-anchor="middle" font-size="13" fill="#1b2733">Every 1 bumps the counter. Every 0 inherits the session above it.</text>
<text x="460" y="368" text-anchor="middle" font-size="12" fill="#5b6b7a">The sum is over rowsBetween(unboundedPreceding, currentRow), then cast to int.</text>
</svg>
