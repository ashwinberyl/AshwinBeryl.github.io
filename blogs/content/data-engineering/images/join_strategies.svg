<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="390" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Two ways to join: copy the small table, or shuffle both</text>

  <!-- broadcast panel -->
  <rect x="20" y="55" width="410" height="320" rx="12" fill="#f5f8fc" stroke="#3a78c2" stroke-width="2"/>
  <text x="225" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#173d6b">Broadcast hash join</text>
  <g fill="#ffffff" stroke="#3a78c2" stroke-width="1.5">
    <rect x="45" y="115" width="130" height="40" rx="6"/>
    <rect x="45" y="175" width="130" height="40" rx="6"/>
    <rect x="45" y="235" width="130" height="40" rx="6"/>
    <rect x="195" y="115" width="95" height="40" rx="6"/>
    <rect x="195" y="175" width="95" height="40" rx="6"/>
    <rect x="195" y="235" width="95" height="40" rx="6"/>
  </g>
  <rect x="335" y="165" width="80" height="60" rx="8" fill="#e3effb" stroke="#3a78c2" stroke-width="2"/>
  <g font-size="13" text-anchor="middle" fill="#1b2733">
    <text x="110" y="140">events p0</text><text x="110" y="200">events p1</text><text x="110" y="260">events p2</text>
    <text x="242" y="140">actors copy</text><text x="242" y="200">actors copy</text><text x="242" y="260">actors copy</text>
    <text x="375" y="191" font-weight="700">actors</text><text x="375" y="209">(small)</text>
  </g>
  <g stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)">
    <line x1="335" y1="185" x2="292" y2="140"/>
    <line x1="335" y1="195" x2="292" y2="195"/>
    <line x1="335" y1="205" x2="292" y2="255"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#1b2733">
    <text x="225" y="312">The big table stays where it is</text>
    <text x="225" y="333">The small table is copied to every executor</text>
    <text x="225" y="354" font-weight="700" fill="#173d6b">No hot partition possible</text>
  </g>

  <!-- sort-merge panel -->
  <rect x="470" y="55" width="410" height="320" rx="12" fill="#fdf5ec" stroke="#d9822b" stroke-width="2"/>
  <text x="675" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#7a3f00">Sort-merge join</text>
  <g fill="#ffffff" stroke="#d9822b" stroke-width="1.5">
    <rect x="495" y="130" width="90" height="40" rx="6"/>
    <rect x="495" y="220" width="90" height="40" rx="6"/>
    <rect x="715" y="115" width="140" height="40" rx="6"/>
    <rect x="715" y="175" width="140" height="40" rx="6" fill="#fbe3dc" stroke="#c0452b" stroke-width="2"/>
    <rect x="715" y="235" width="140" height="40" rx="6"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#1b2733">
    <text x="540" y="155">events</text><text x="540" y="245">actors</text>
    <text x="785" y="140">partition 0</text><text x="785" y="200" font-weight="700" fill="#8a2a14">partition 1 (dave)</text><text x="785" y="260">partition 2</text>
  </g>
  <g stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a)">
    <line x1="585" y1="142" x2="713" y2="130"/>
    <line x1="585" y1="150" x2="713" y2="190"/>
    <line x1="585" y1="158" x2="713" y2="250"/>
    <line x1="585" y1="232" x2="713" y2="138"/>
    <line x1="585" y1="240" x2="713" y2="198"/>
    <line x1="585" y1="248" x2="713" y2="258"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#1b2733">
    <text x="675" y="312">Both tables shuffle by key, then sort</text>
    <text x="675" y="333">All rows of one key meet in one partition</text>
    <text x="675" y="354" font-weight="700" fill="#8a2a14">A hot key makes one slow task</text>
  </g>
</svg>
