<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="960" height="400" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker></defs>
<text x="480" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">One daily run, start to finish</text>
<text x="480" y="54" text-anchor="middle" font-size="13" fill="#5b6b7a">Row counts under each step show what the two tables hold afterwards.</text>
<rect x="30" y="80" width="135" height="118" rx="8" fill="#f5f7f9" stroke="#b9c6d3" stroke-width="1.5"/>
<text x="40" y="104" font-size="12" font-weight="700" fill="#5b6b7a">1 · Set up</text>
<text x="40" y="130" font-size="12" fill="#1b2733">create_tables</text>
<text x="40" y="151" font-size="12" fill="#1b2733">both tables empty</text>
<path d="M166 139 H181" stroke="#5b6b7a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<rect x="30" y="212" width="135" height="56" rx="6" fill="#ffffff" stroke="#b9c6d3"/>
<text x="40" y="236" font-size="12" fill="#5b6b7a">events</text><text x="155" y="236" text-anchor="end" font-size="13" font-weight="700" fill="#1b2733">0</text>
<text x="40" y="256" font-size="12" fill="#5b6b7a">repo_dim</text><text x="155" y="256" text-anchor="end" font-size="13" font-weight="700" fill="#1b2733">0</text>
<rect x="183" y="80" width="135" height="118" rx="8" fill="#f5f7f9" stroke="#b9c6d3" stroke-width="1.5"/>
<text x="193" y="104" font-size="12" font-weight="700" fill="#5b6b7a">2 · Batch 1</text>
<text x="193" y="130" font-size="12" fill="#1b2733">upsert_events → 5</text>
<text x="193" y="151" font-size="12" fill="#1b2733">merge_repo_scd2</text>
<text x="193" y="172" font-size="12" fill="#1b2733">(c1, c3, c4)</text>
<path d="M319 139 H334" stroke="#5b6b7a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<rect x="183" y="212" width="135" height="56" rx="6" fill="#ffffff" stroke="#b9c6d3"/>
<text x="193" y="236" font-size="12" fill="#5b6b7a">events</text><text x="308" y="236" text-anchor="end" font-size="13" font-weight="700" fill="#1b2733">5</text>
<text x="193" y="256" font-size="12" fill="#5b6b7a">repo_dim</text><text x="308" y="256" text-anchor="end" font-size="13" font-weight="700" fill="#1b2733">3</text>
<rect x="336" y="80" width="135" height="118" rx="8" fill="#f5f7f9" stroke="#b9c6d3" stroke-width="1.5"/>
<text x="346" y="104" font-size="12" font-weight="700" fill="#5b6b7a">3 · Bookmark</text>
<text x="346" y="130" font-size="12" fill="#1b2733">day1_snapshot</text>
<text x="346" y="151" font-size="12" fill="#1b2733">= first snapshot</text>
<text x="346" y="172" font-size="12" fill="#1b2733">6 columns</text>
<path d="M472 139 H487" stroke="#5b6b7a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<rect x="336" y="212" width="135" height="56" rx="6" fill="#ffffff" stroke="#b9c6d3"/>
<text x="346" y="236" font-size="12" fill="#5b6b7a">events</text><text x="461" y="236" text-anchor="end" font-size="13" font-weight="700" fill="#1b2733">5</text>
<text x="346" y="256" font-size="12" fill="#5b6b7a">repo_dim</text><text x="461" y="256" text-anchor="end" font-size="13" font-weight="700" fill="#1b2733">3</text>
<rect x="489" y="80" width="135" height="118" rx="8" fill="#f5f7f9" stroke="#b9c6d3" stroke-width="1.5"/>
<text x="499" y="104" font-size="12" font-weight="700" fill="#5b6b7a">4 · Evolve</text>
<text x="499" y="130" font-size="12" fill="#1b2733">+ actor_id BIGINT</text>
<text x="499" y="151" font-size="12" fill="#1b2733">metadata only,</text>
<text x="499" y="172" font-size="12" fill="#1b2733">no file rewritten</text>
<path d="M625 139 H640" stroke="#5b6b7a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<rect x="489" y="212" width="135" height="56" rx="6" fill="#ffffff" stroke="#b9c6d3"/>
<text x="499" y="236" font-size="12" fill="#5b6b7a">events</text><text x="614" y="236" text-anchor="end" font-size="13" font-weight="700" fill="#1b2733">5</text>
<text x="499" y="256" font-size="12" fill="#5b6b7a">repo_dim</text><text x="614" y="256" text-anchor="end" font-size="13" font-weight="700" fill="#1b2733">3</text>
<rect x="642" y="80" width="135" height="118" rx="8" fill="#dde9f7" stroke="#1d5fa8" stroke-width="1.5"/>
<text x="652" y="104" font-size="12" font-weight="700" fill="#1d5fa8">5 · Batch 2</text>
<text x="652" y="130" font-size="12" fill="#1b2733">upsert_events → 5</text>
<text x="652" y="151" font-size="12" fill="#1b2733">c1 updated</text>
<text x="652" y="172" font-size="12" fill="#1b2733">c2, c6 inserted</text>
<path d="M778 139 H793" stroke="#5b6b7a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<rect x="642" y="212" width="135" height="56" rx="6" fill="#ffffff" stroke="#b9c6d3"/>
<text x="652" y="236" font-size="12" fill="#5b6b7a">events</text><text x="767" y="236" text-anchor="end" font-size="13" font-weight="700" fill="#1b2733">10</text>
<text x="652" y="256" font-size="12" fill="#5b6b7a">repo_dim</text><text x="767" y="256" text-anchor="end" font-size="13" font-weight="700" fill="#1b2733">5</text>
<rect x="795" y="80" width="135" height="118" rx="8" fill="#f5f7f9" stroke="#b9c6d3" stroke-width="1.5"/>
<text x="805" y="104" font-size="12" font-weight="700" fill="#5b6b7a">6 · Batch 2 again</text>
<text x="805" y="130" font-size="12" fill="#1b2733">upsert_events → 0</text>
<text x="805" y="151" font-size="12" fill="#1b2733">nothing new,</text>
<text x="805" y="172" font-size="12" fill="#1b2733">no MERGE run</text>
<rect x="795" y="212" width="135" height="56" rx="6" fill="#ffffff" stroke="#b9c6d3"/>
<text x="805" y="236" font-size="12" fill="#5b6b7a">events</text><text x="920" y="236" text-anchor="end" font-size="13" font-weight="700" fill="#1b2733">10</text>
<text x="805" y="256" font-size="12" fill="#5b6b7a">repo_dim</text><text x="920" y="256" text-anchor="end" font-size="13" font-weight="700" fill="#1b2733">5</text>
<rect x="30" y="296" width="900" height="76" rx="8" fill="#fbeed6" stroke="#8f5300" stroke-width="1.2"/>
<text x="46" y="320" font-size="13" font-weight="700" fill="#8f5300">7 · Prove it, then tidy up</text>
<text x="46" y="341" font-size="12" fill="#1b2733">read_events_as_of(day1_snapshot) → 5 rows, 6 columns (the table as it was after step 2).</text>
<text x="46" y="360" font-size="12" fill="#1b2733">compact_events() → (before, after) files; still 10 rows, and nothing differs from before.</text>
</svg>
