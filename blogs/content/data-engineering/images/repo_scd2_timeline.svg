<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="960" height="430" fill="#ffffff"/>
<text x="480" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Repo versions as half-open intervals [valid_from, valid_to)</text>
<text x="480" y="54" text-anchor="middle" font-size="13" fill="#5b6b7a">Each bar includes its left edge and excludes its right edge. Every event falls in at most one bar.</text>

<!-- grid -->
<g stroke="#e3e8ed" stroke-width="1">
