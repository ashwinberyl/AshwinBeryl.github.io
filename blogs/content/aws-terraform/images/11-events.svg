<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Upload path: S3 to SQS to Lambda to DynamoDB with a dead-letter queue. Schedule and state-change paths through EventBridge and SNS.">
  <rect width="900" height="500" fill="#ffffff"/>
  <defs>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e72"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24a4a"/></marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a78c2"/></marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c98a1a"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a55b8"/></marker>
  </defs>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Two event paths in one stack</text>
  <rect x="30" y="60" width="150" height="56" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="105.0" y="83.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">S3 raw/</text>
  <text x="105.0" y="107.0" text-anchor="middle" font-size="13" fill="#1b2733">ObjectCreated</text>
  <rect x="230" y="60" width="170" height="56" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="315.0" y="83.0" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">SQS ingest</text>
  <text x="315.0" y="107.0" text-anchor="middle" font-size="13" fill="#1b2733">visibility 60 s</text>
  <rect x="450" y="60" width="170" height="56" rx="10" fill="#efe8f8" stroke="#7a55b8" stroke-width="1.5"/>
  <text x="535.0" y="83.0" text-anchor="middle" font-size="15" font-weight="700" fill="#3f2a6b">Lambda ingest</text>
  <text x="535.0" y="107.0" text-anchor="middle" font-size="13" fill="#1b2733">batch 5, partial fail</text>
  <rect x="670" y="60" width="200" height="56" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="770.0" y="83.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">DynamoDB plat-jobs</text>
  <text x="770.0" y="107.0" text-anchor="middle" font-size="13" fill="#1b2733">status INGESTED, TTL</text>
  <rect x="230" y="170" width="170" height="56" rx="10" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
  <text x="315.0" y="193.0" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a07">DLQ</text>
  <text x="315.0" y="217.0" text-anchor="middle" font-size="13" fill="#1b2733">after 3 receives</text>
  <line x1="180" y1="88" x2="230" y2="88" stroke="#2f9e72" stroke-width="2" marker-end="url(#m-green)"/>
  <line x1="400" y1="88" x2="450" y2="88" stroke="#3a78c2" stroke-width="2" marker-end="url(#m-blue)"/>
  <line x1="620" y1="88" x2="670" y2="88" stroke="#7a55b8" stroke-width="2" marker-end="url(#m-purple)"/>
  <line x1="315" y1="116" x2="315" y2="170" stroke="#c98a1a" stroke-width="2" marker-end="url(#m-amber)"/>
  <text x="315.0" y="143.0" text-anchor="middle" font-size="12" fill="#1b2733">failed 3x</text>
  <rect x="30" y="300" width="200" height="70" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="130.0" y="320.0" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">EventBridge</text>
  <text x="130.0" y="344.0" text-anchor="middle" font-size="13" fill="#1b2733">rule nightly (cron UTC)</text>
  <text x="130.0" y="364.0" text-anchor="middle" font-size="13" fill="#1b2733">rule ec2 state change</text>
  <rect x="300" y="300" width="190" height="70" rx="10" fill="#efe8f8" stroke="#7a55b8" stroke-width="1.5"/>
  <text x="395.0" y="330.0" text-anchor="middle" font-size="15" font-weight="700" fill="#3f2a6b">Lambda report</text>
  <text x="395.0" y="354.0" text-anchor="middle" font-size="13" fill="#1b2733">scan, count by status</text>
  <rect x="570" y="300" width="190" height="70" rx="10" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
  <text x="665.0" y="330.0" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a07">SNS plat-alerts</text>
  <text x="665.0" y="354.0" text-anchor="middle" font-size="13" fill="#1b2733">topic policy required</text>
  <rect x="570" y="410" width="190" height="50" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="665.0" y="430.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">Email subscriber</text>
  <text x="665.0" y="454.0" text-anchor="middle" font-size="13" fill="#1b2733">confirm by link</text>
  <line x1="230" y1="335" x2="300" y2="335" stroke="#3a78c2" stroke-width="2" marker-end="url(#m-blue)"/>
  <line x1="490" y1="335" x2="570" y2="335" stroke="#7a55b8" stroke-width="2" marker-end="url(#m-purple)"/>
  <line x1="665" y1="370" x2="665" y2="410" stroke="#c98a1a" stroke-width="2" marker-end="url(#m-amber)"/>
  <text x="450" y="485" text-anchor="middle" font-size="12.5" font-style="italic" fill="#2b3945">State-change events go straight from EventBridge to SNS. Without the topic policy they are silently dropped.</text>
</svg>
