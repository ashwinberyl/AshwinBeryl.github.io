<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="A stack passes inputs to the vpc module, which creates the VPC resources and returns outputs">
  <rect width="900" height="470" fill="#ffffff"/>
  <defs>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e72"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24a4a"/></marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a78c2"/></marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c98a1a"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a55b8"/></marker>
  </defs>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">The network stack calls the vpc module</text>
  <rect x="20" y="60" width="260" height="380" rx="14" fill="none" stroke="#3a78c2" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="34" y="80" text-anchor="start" font-size="13" font-weight="700" fill="#173d6b">stacks/20-network</text>
  <rect x="40" y="90" width="220" height="70" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="150.0" y="110.0" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">variables</text>
  <text x="150.0" y="134.0" text-anchor="middle" font-size="13" fill="#1b2733">vpc_cidr, azs, enable_nat</text>
  <text x="150.0" y="154.0" text-anchor="middle" font-size="13" fill="#1b2733">subnet CIDR lists</text>
  <rect x="40" y="190" width="220" height="70" rx="10" fill="#efe8f8" stroke="#7a55b8" stroke-width="1.5"/>
  <text x="150.0" y="220.0" text-anchor="middle" font-size="15" font-weight="700" fill="#3f2a6b">module "vpc"</text>
  <text x="150.0" y="244.0" text-anchor="middle" font-size="13" fill="#1b2733">source = ../../modules/vpc</text>
  <rect x="40" y="300" width="220" height="110" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="150.0" y="320.0" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">outputs</text>
  <text x="150.0" y="344.0" text-anchor="middle" font-size="13" fill="#1b2733">vpc_id, vpc_cidr</text>
  <text x="150.0" y="364.0" text-anchor="middle" font-size="13" fill="#1b2733">public_subnet_ids</text>
  <text x="150.0" y="384.0" text-anchor="middle" font-size="13" fill="#1b2733">private_subnet_ids</text>
  <text x="150.0" y="404.0" text-anchor="middle" font-size="13" fill="#1b2733">private_route_table_id</text>
  <rect x="330" y="60" width="550" height="380" rx="14" fill="none" stroke="#2f9e72" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="344" y="80" text-anchor="start" font-size="13" font-weight="700" fill="#124d38">modules/vpc</text>
  <rect x="350" y="90" width="160" height="60" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="430.0" y="115.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">aws_vpc</text>
  <text x="430.0" y="139.0" text-anchor="middle" font-size="13" fill="#1b2733">+ internet gateway</text>
  <rect x="530" y="90" width="160" height="60" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="610.0" y="105.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">aws_subnet</text>
  <text x="610.0" y="129.0" text-anchor="middle" font-size="13" fill="#1b2733">public / private</text>
  <text x="610.0" y="149.0" text-anchor="middle" font-size="13" fill="#1b2733">for_each by AZ letter</text>
  <rect x="710" y="90" width="150" height="60" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="785.0" y="115.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">route tables</text>
  <text x="785.0" y="139.0" text-anchor="middle" font-size="13" fill="#1b2733">public, private</text>
  <rect x="350" y="190" width="240" height="70" rx="10" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
  <text x="470.0" y="220.0" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a07">NAT (count = enable_nat)</text>
  <text x="470.0" y="244.0" text-anchor="middle" font-size="13" fill="#1b2733">EIP + gateway + route</text>
  <rect x="620" y="190" width="240" height="70" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="740.0" y="220.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">gateway endpoints</text>
  <text x="740.0" y="244.0" text-anchor="middle" font-size="13" fill="#1b2733">s3, dynamodb (for_each)</text>
  <rect x="350" y="300" width="510" height="110" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="605.0" y="340.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">outputs.tf</text>
  <text x="605.0" y="364.0" text-anchor="middle" font-size="13" fill="#1b2733">maps keyed by AZ letter: { a = subnet-…, b = subnet-… }</text>
  <text x="605.0" y="384.0" text-anchor="middle" font-size="13" fill="#1b2733">another stack reads them with terraform_remote_state</text>
  <line x1="150" y1="160" x2="150" y2="190" stroke="#3a78c2" stroke-width="2" marker-end="url(#m-blue)"/>
  <line x1="260" y1="225" x2="350" y2="225" stroke="#7a55b8" stroke-width="2" marker-end="url(#m-purple)"/>
  <text x="305.0" y="215.0" text-anchor="middle" font-size="12" fill="#1b2733">inputs</text>
  <line x1="430" y1="260" x2="430" y2="300" stroke="#2f9e72" stroke-width="2" marker-end="url(#m-green)"/>
  <line x1="350" y1="355" x2="260" y2="355" stroke="#2f9e72" stroke-width="2" marker-end="url(#m-green)"/>
  <text x="305.0" y="345.0" text-anchor="middle" font-size="12" fill="#1b2733">outputs</text>
</svg>
