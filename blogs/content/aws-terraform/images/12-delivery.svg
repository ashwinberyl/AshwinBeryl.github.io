<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="GitHub connection, three pipeline stages, CodeBuild pushing to ECR, ECS deploy via imagedefinitions.json, failure alert through EventBridge">
  <rect width="900" height="430" fill="#ffffff"/>
  <defs>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e72"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24a4a"/></marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a78c2"/></marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c98a1a"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a55b8"/></marker>
  </defs>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">From a git push to a running task</text>
  <rect x="20" y="70" width="150" height="70" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="95.0" y="100.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">GitHub repo</text>
  <text x="95.0" y="124.0" text-anchor="middle" font-size="13" fill="#1b2733">push to main</text>
  <rect x="210" y="60" width="170" height="90" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="295.0" y="90.0" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">Source</text>
  <text x="295.0" y="114.0" text-anchor="middle" font-size="13" fill="#1b2733">CodeStar connection</text>
  <text x="295.0" y="134.0" text-anchor="middle" font-size="13" fill="#1b2733">plat-github (authorise once)</text>
  <rect x="420" y="60" width="170" height="90" rx="10" fill="#efe8f8" stroke="#7a55b8" stroke-width="1.5"/>
  <text x="505.0" y="90.0" text-anchor="middle" font-size="15" font-weight="700" fill="#3f2a6b">Build</text>
  <text x="505.0" y="114.0" text-anchor="middle" font-size="13" fill="#1b2733">CodeBuild plat-api-build</text>
  <text x="505.0" y="134.0" text-anchor="middle" font-size="13" fill="#1b2733">docker build + push</text>
  <rect x="630" y="60" width="240" height="90" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="750.0" y="90.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">Deploy (toggle)</text>
  <text x="750.0" y="114.0" text-anchor="middle" font-size="13" fill="#1b2733">ECS action, imagedefinitions.json</text>
  <text x="750.0" y="134.0" text-anchor="middle" font-size="13" fill="#1b2733">enable_deploy_stage</text>
  <rect x="420" y="200" width="170" height="56" rx="10" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
  <text x="505.0" y="223.0" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a07">ECR plat-api</text>
  <text x="505.0" y="247.0" text-anchor="middle" font-size="13" fill="#1b2733">tag = commit id</text>
  <rect x="630" y="200" width="240" height="56" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="750.0" y="223.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">ECS service plat-api-svc</text>
  <text x="750.0" y="247.0" text-anchor="middle" font-size="13" fill="#1b2733">new task definition revision</text>
  <rect x="210" y="200" width="170" height="56" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="295.0" y="223.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">Artifact bucket</text>
  <text x="295.0" y="247.0" text-anchor="middle" font-size="13" fill="#1b2733">14-day expiry</text>
  <rect x="210" y="320" width="380" height="60" rx="10" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
  <text x="400.0" y="345.0" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a07">EventBridge plat-pipeline-failed</text>
  <text x="400.0" y="369.0" text-anchor="middle" font-size="13" fill="#1b2733">FAILED execution, SNS plat-alerts</text>
  <line x1="170" y1="105" x2="210" y2="105" stroke="#3a78c2" stroke-width="2" marker-end="url(#m-blue)"/>
  <line x1="380" y1="105" x2="420" y2="105" stroke="#7a55b8" stroke-width="2" marker-end="url(#m-purple)"/>
  <line x1="590" y1="105" x2="630" y2="105" stroke="#2f9e72" stroke-width="2" marker-end="url(#m-green)"/>
  <line x1="505" y1="150" x2="505" y2="200" stroke="#c98a1a" stroke-width="2" marker-end="url(#m-amber)"/>
  <text x="505.0" y="167.0" text-anchor="middle" font-size="12" fill="#1b2733">push</text>
  <line x1="750" y1="150" x2="750" y2="200" stroke="#2f9e72" stroke-width="2" marker-end="url(#m-green)"/>
  <line x1="295" y1="150" x2="295" y2="200" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <text x="329.0" y="175.0" text-anchor="middle" font-size="12" fill="#1b2733">artifacts</text>
  <text x="450" y="410" text-anchor="middle" font-size="12.5" font-style="italic" fill="#2b3945">Three roles: the pipeline role orchestrates, the build role pushes images, ECS roles are only passed along (iam:PassRole).</text>
</svg>
