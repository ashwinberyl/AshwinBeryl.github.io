<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Execution role shared by Studio and the model, Studio in private subnets, endpoint created only when enable_endpoint and model_data_url are both set">
  <rect width="900" height="450" fill="#ffffff"/>
  <defs>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e72"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24a4a"/></marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a78c2"/></marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c98a1a"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a55b8"/></marker>
  </defs>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">SageMaker: a free-until-used domain, and a costly endpoint on a switch</text>
  <rect x="30" y="60" width="230" height="80" rx="10" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
  <text x="145.0" y="85.0" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a07">plat-sm-role</text>
  <text x="145.0" y="109.0" text-anchor="middle" font-size="13" fill="#1b2733">AmazonSageMakerFullAccess</text>
  <text x="145.0" y="129.0" text-anchor="middle" font-size="13" fill="#1b2733">+ S3 prefixes, KMS</text>
  <rect x="310" y="50" width="560" height="180" rx="14" fill="none" stroke="#2f9e72" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="324" y="70" text-anchor="start" font-size="13" font-weight="700" fill="#124d38">Studio (enable_studio) in private subnets, VpcOnly</text>
  <rect x="330" y="90" width="160" height="60" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="410.0" y="115.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">Domain plat-studio</text>
  <text x="410.0" y="139.0" text-anchor="middle" font-size="13" fill="#1b2733">auth IAM</text>
  <rect x="510" y="90" width="160" height="60" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="590.0" y="115.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">Profiles</text>
  <text x="590.0" y="139.0" text-anchor="middle" font-size="13" fill="#1b2733">jim, dave (for_each)</text>
  <rect x="690" y="90" width="160" height="60" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="770.0" y="115.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">plat-studio-sg</text>
  <text x="770.0" y="139.0" text-anchor="middle" font-size="13" fill="#1b2733">self rule only</text>
  <text x="590" y="195" text-anchor="middle" font-size="12.5" font-style="italic" fill="#2b3945">Needs NAT or VPC endpoints to reach SageMaker and S3</text>
  <rect x="30" y="290" width="230" height="70" rx="10" fill="#efe8f8" stroke="#7a55b8" stroke-width="1.5"/>
  <text x="145.0" y="310.0" text-anchor="middle" font-size="15" font-weight="700" fill="#3f2a6b">Training job (by hand)</text>
  <text x="145.0" y="334.0" text-anchor="middle" font-size="13" fill="#1b2733">XGBoost, train.csv</text>
  <text x="145.0" y="354.0" text-anchor="middle" font-size="13" fill="#1b2733">writes model.tar.gz</text>
  <rect x="310" y="290" width="170" height="70" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="395.0" y="320.0" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">Model</text>
  <text x="395.0" y="344.0" text-anchor="middle" font-size="13" fill="#1b2733">model_data_url</text>
  <rect x="520" y="290" width="170" height="70" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="605.0" y="320.0" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">Endpoint config</text>
  <text x="605.0" y="344.0" text-anchor="middle" font-size="13" fill="#1b2733">1 x ml.t2.medium</text>
  <rect x="730" y="290" width="140" height="70" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="800.0" y="320.0" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">Endpoint</text>
  <text x="800.0" y="344.0" text-anchor="middle" font-size="13" fill="#1b2733">plat-churn</text>
  <line x1="260" y1="325" x2="310" y2="325" stroke="#7a55b8" stroke-width="2" marker-end="url(#m-purple)"/>
  <line x1="480" y1="325" x2="520" y2="325" stroke="#3a78c2" stroke-width="2" marker-end="url(#m-blue)"/>
  <line x1="690" y1="325" x2="730" y2="325" stroke="#3a78c2" stroke-width="2" marker-end="url(#m-blue)"/>
  <text x="450" y="410" text-anchor="middle" font-size="12.5" font-style="italic" fill="#2b3945">Model and config use name_prefix with create_before_destroy so a new model can replace an old one without a gap.</text>
</svg>
