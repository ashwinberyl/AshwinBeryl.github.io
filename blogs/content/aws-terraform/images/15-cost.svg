<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Two budgets notify email and SNS; cost allocation tags make the project filterable; anomaly detection watches per-service spend">
  <rect width="900" height="430" fill="#ffffff"/>
  <defs>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e72"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24a4a"/></marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a78c2"/></marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c98a1a"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a55b8"/></marker>
  </defs>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Cost controls: budgets, tags and anomaly detection</text>
  <rect x="30" y="60" width="220" height="70" rx="10" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
  <text x="140.0" y="80.0" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a07">Monthly budget</text>
  <text x="140.0" y="104.0" text-anchor="middle" font-size="13" fill="#1b2733">plat-monthly-guard, whole account</text>
  <text x="140.0" y="124.0" text-anchor="middle" font-size="13" fill="#1b2733">$20: 80% actual, 100% forecast</text>
  <rect x="30" y="170" width="220" height="70" rx="10" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
  <text x="140.0" y="190.0" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a07">Tagged budget</text>
  <text x="140.0" y="214.0" text-anchor="middle" font-size="13" fill="#1b2733">plat-tagged-monthly, $15</text>
  <text x="140.0" y="234.0" text-anchor="middle" font-size="13" fill="#1b2733">filter user:project$plat</text>
  <rect x="330" y="60" width="220" height="70" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="440.0" y="90.0" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">SNS plat-alerts + email</text>
  <text x="440.0" y="114.0" text-anchor="middle" font-size="13" fill="#1b2733">budgets.amazonaws.com in policy</text>
  <rect x="330" y="170" width="220" height="70" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="440.0" y="190.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">Cost allocation tags</text>
  <text x="440.0" y="214.0" text-anchor="middle" font-size="13" fill="#1b2733">project, managed_by, stack</text>
  <text x="440.0" y="234.0" text-anchor="middle" font-size="13" fill="#1b2733">Active (toggle)</text>
  <rect x="640" y="60" width="230" height="70" rx="10" fill="#efe8f8" stroke="#7a55b8" stroke-width="1.5"/>
  <text x="755.0" y="80.0" text-anchor="middle" font-size="15" font-weight="700" fill="#3f2a6b">Anomaly monitor</text>
  <text x="755.0" y="104.0" text-anchor="middle" font-size="13" fill="#1b2733">dimension SERVICE</text>
  <text x="755.0" y="124.0" text-anchor="middle" font-size="13" fill="#1b2733">daily email, impact &gt;= $5</text>
  <rect x="640" y="170" width="230" height="70" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="755.0" y="190.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">Cost Explorer</text>
  <text x="755.0" y="214.0" text-anchor="middle" font-size="13" fill="#1b2733">enable once by hand</text>
  <text x="755.0" y="234.0" text-anchor="middle" font-size="13" fill="#1b2733">data lags up to a day</text>
  <line x1="250" y1="95" x2="330" y2="95" stroke="#c98a1a" stroke-width="2" marker-end="url(#m-amber)"/>
  <line x1="250" y1="205" x2="330" y2="205" stroke="#2f9e72" stroke-width="2" marker-end="url(#m-green)"/>
  <text x="290.0" y="197.0" text-anchor="middle" font-size="12" fill="#1b2733">needs</text>
  <line x1="640" y1="95" x2="550" y2="95" stroke="#7a55b8" stroke-width="2" marker-end="url(#m-purple)"/>
  <line x1="755" y1="170" x2="755" y2="130" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <rect x="30" y="290" width="840" height="60" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="450.0" y="325.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">Default tags from every stack's provider: project = plat, managed_by = terraform, stack = &lt;name&gt;</text>
  <text x="450" y="395" text-anchor="middle" font-size="12.5" font-style="italic" fill="#2b3945">A tag appears in billing data only after a taxed resource carries it, then can be activated.</text>
</svg>
