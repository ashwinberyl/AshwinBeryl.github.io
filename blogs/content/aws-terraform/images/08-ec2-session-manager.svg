<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="The instance has no public IP; Session Manager reaches it through the SSM endpoints or a NAT gateway">
  <rect width="900" height="430" fill="#ffffff"/>
  <defs>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e72"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24a4a"/></marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a78c2"/></marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c98a1a"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a55b8"/></marker>
  </defs>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">A private instance managed without any inbound port</text>
  <rect x="30" y="70" width="190" height="70" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="125.0" y="100.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">You</text>
  <text x="125.0" y="124.0" text-anchor="middle" font-size="13" fill="#1b2733">aws ssm start-session</text>
  <rect x="300" y="70" width="200" height="70" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="400.0" y="90.0" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">Systems Manager</text>
  <text x="400.0" y="114.0" text-anchor="middle" font-size="13" fill="#1b2733">ssm, ssmmessages,</text>
  <text x="400.0" y="134.0" text-anchor="middle" font-size="13" fill="#1b2733">ec2messages</text>
  <rect x="300" y="230" width="200" height="70" rx="10" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
  <text x="400.0" y="250.0" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a07">Path out (pick one)</text>
  <text x="400.0" y="274.0" text-anchor="middle" font-size="13" fill="#1b2733">3 interface endpoints</text>
  <text x="400.0" y="294.0" text-anchor="middle" font-size="13" fill="#1b2733">or the NAT gateway</text>
  <rect x="600" y="170" width="270" height="220" rx="14" fill="none" stroke="#2f9e72" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="614" y="190" text-anchor="start" font-size="13" font-weight="700" fill="#124d38">Private subnet a</text>
  <rect x="620" y="210" width="230" height="56" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="735.0" y="233.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">plat-ec2 (t3.micro)</text>
  <text x="735.0" y="257.0" text-anchor="middle" font-size="13" fill="#1b2733">role plat-ec2-role, IMDSv2</text>
  <rect x="620" y="300" width="110" height="60" rx="10" fill="#efe8f8" stroke="#7a55b8" stroke-width="1.5"/>
  <text x="675.0" y="325.0" text-anchor="middle" font-size="15" font-weight="700" fill="#3f2a6b">EFS</text>
  <text x="675.0" y="349.0" text-anchor="middle" font-size="13" fill="#1b2733">/mnt/ml</text>
  <rect x="740" y="300" width="110" height="60" rx="10" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
  <text x="795.0" y="325.0" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a07">S3 + KMS</text>
  <text x="795.0" y="349.0" text-anchor="middle" font-size="13" fill="#1b2733">role policy</text>
  <line x1="220" y1="105" x2="300" y2="105" stroke="#3a78c2" stroke-width="2" marker-end="url(#m-blue)"/>
  <text x="260.0" y="97.0" text-anchor="middle" font-size="12" fill="#1b2733">HTTPS</text>
  <line x1="500" y1="105" x2="735" y2="170" stroke="#3a78c2" stroke-width="2" marker-end="url(#m-blue)"/>
  <line x1="620" y1="240" x2="500" y2="262" stroke="#c98a1a" stroke-width="2" marker-end="url(#m-amber)"/>
  <text x="560.0" y="243.0" text-anchor="middle" font-size="12" fill="#1b2733">outbound only</text>
  <text x="450" y="405" text-anchor="middle" font-size="12.5" font-style="italic" fill="#2b3945">No inbound rule exists. The agent on the instance dials out and holds the session open.</text>
</svg>
