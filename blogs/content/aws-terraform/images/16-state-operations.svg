<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Import copies real to state, moved renames inside state, removed forgets, state rm forgets, replace forces a new object, refresh-only updates state from real">
  <rect width="900" height="470" fill="#ffffff"/>
  <defs>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e72"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24a4a"/></marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a78c2"/></marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c98a1a"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a55b8"/></marker>
  </defs>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Code, state and the real world: which command moves what</text>
  <rect x="30" y="70" width="200" height="90" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="130.0" y="100.0" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">Code (.tf)</text>
  <text x="130.0" y="124.0" text-anchor="middle" font-size="13" fill="#1b2733">what you want</text>
  <text x="130.0" y="144.0" text-anchor="middle" font-size="13" fill="#1b2733">resource addresses</text>
  <rect x="350" y="70" width="200" height="90" rx="10" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
  <text x="450.0" y="100.0" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a07">State (S3)</text>
  <text x="450.0" y="124.0" text-anchor="middle" font-size="13" fill="#1b2733">address -&gt; real id</text>
  <text x="450.0" y="144.0" text-anchor="middle" font-size="13" fill="#1b2733">versioned bucket</text>
  <rect x="670" y="70" width="200" height="90" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="770.0" y="110.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">Real AWS</text>
  <text x="770.0" y="134.0" text-anchor="middle" font-size="13" fill="#1b2733">what exists now</text>
  <line x1="230" y1="105" x2="350" y2="105" stroke="#3a78c2" stroke-width="2" marker-end="url(#m-blue)"/>
  <text x="290.0" y="97.0" text-anchor="middle" font-size="12" fill="#1b2733">plan / apply</text>
  <line x1="670" y1="125" x2="550" y2="125" stroke="#2f9e72" stroke-width="2" marker-end="url(#m-green)"/>
  <text x="610.0" y="139.0" text-anchor="middle" font-size="12" fill="#1b2733">refresh</text>
  <line x1="550" y1="95" x2="670" y2="95" stroke="#c98a1a" stroke-width="2" marker-end="url(#m-amber)"/>
  <text x="610.0" y="87.0" text-anchor="middle" font-size="12" fill="#1b2733">apply</text>
  <rect x="30" y="230" width="265" height="70" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="162.5" y="260.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">import block</text>
  <text x="162.5" y="284.0" text-anchor="middle" font-size="13" fill="#1b2733">real -&gt; state (adopt)</text>
  <rect x="315" y="230" width="265" height="70" rx="10" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
  <text x="447.5" y="260.0" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a07">moved block</text>
  <text x="447.5" y="284.0" text-anchor="middle" font-size="13" fill="#1b2733">rename inside state</text>
  <rect x="600" y="230" width="265" height="70" rx="10" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
  <text x="732.5" y="260.0" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a07">removed block</text>
  <text x="732.5" y="284.0" text-anchor="middle" font-size="13" fill="#1b2733">forget, keep real object</text>
  <rect x="30" y="330" width="265" height="70" rx="10" fill="#efe8f8" stroke="#7a55b8" stroke-width="1.5"/>
  <text x="162.5" y="360.0" text-anchor="middle" font-size="15" font-weight="700" fill="#3f2a6b">-replace=addr</text>
  <text x="162.5" y="384.0" text-anchor="middle" font-size="13" fill="#1b2733">destroy + create next apply</text>
  <rect x="315" y="330" width="265" height="70" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="447.5" y="360.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">state rm / mv</text>
  <text x="447.5" y="384.0" text-anchor="middle" font-size="13" fill="#1b2733">imperative versions</text>
  <rect x="600" y="330" width="265" height="70" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="732.5" y="360.0" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">-refresh-only</text>
  <text x="732.5" y="384.0" text-anchor="middle" font-size="13" fill="#1b2733">state &lt;- real, no changes</text>
  <text x="450" y="445" text-anchor="middle" font-size="12.5" font-style="italic" fill="#2b3945">State is the only place Terraform remembers which real object each address means. Lose it and the code is a stranger to your infrastructure.</text>
</svg>
