<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Internet to the load balancer in public subnets, tasks in private subnets, two task roles, an image from ECR">
  <rect width="900" height="470" fill="#ffffff"/>
  <defs>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e72"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24a4a"/></marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a78c2"/></marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c98a1a"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a55b8"/></marker>
  </defs>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">ECS on Fargate behind an ALB</text>
  <rect x="30" y="60" width="150" height="56" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="105.0" y="83.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">Internet</text>
  <text x="105.0" y="107.0" text-anchor="middle" font-size="13" fill="#1b2733">port 80</text>
  <rect x="240" y="60" width="200" height="70" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="340.0" y="80.0" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">ALB plat-alb</text>
  <text x="340.0" y="104.0" text-anchor="middle" font-size="13" fill="#1b2733">listener 80</text>
  <text x="340.0" y="124.0" text-anchor="middle" font-size="13" fill="#1b2733">plat-alb-sg</text>
  <rect x="240" y="170" width="200" height="56" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="340.0" y="193.0" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">Target group</text>
  <text x="340.0" y="217.0" text-anchor="middle" font-size="13" fill="#1b2733">type ip, health /</text>
  <rect x="500" y="150" width="370" height="210" rx="14" fill="none" stroke="#2f9e72" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="514" y="170" text-anchor="start" font-size="13" font-weight="700" fill="#124d38">Private subnets</text>
  <rect x="520" y="185" width="160" height="70" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="600.0" y="205.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">Fargate task</text>
  <text x="600.0" y="229.0" text-anchor="middle" font-size="13" fill="#1b2733">container api</text>
  <text x="600.0" y="249.0" text-anchor="middle" font-size="13" fill="#1b2733">plat-api-sg</text>
  <rect x="700" y="185" width="150" height="70" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="775.0" y="215.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">Fargate task</text>
  <text x="775.0" y="239.0" text-anchor="middle" font-size="13" fill="#1b2733">(desired_count)</text>
  <rect x="520" y="290" width="160" height="44" rx="10" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
  <text x="600.0" y="317.0" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a07">exec role: pull + logs</text>
  <rect x="700" y="290" width="150" height="44" rx="10" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
  <text x="775.0" y="317.0" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a07">task role: S3, DDB</text>
  <rect x="30" y="290" width="190" height="70" rx="10" fill="#efe8f8" stroke="#7a55b8" stroke-width="1.5"/>
  <text x="125.0" y="310.0" text-anchor="middle" font-size="15" font-weight="700" fill="#3f2a6b">ECR plat-api</text>
  <text x="125.0" y="334.0" text-anchor="middle" font-size="13" fill="#1b2733">scan on push</text>
  <text x="125.0" y="354.0" text-anchor="middle" font-size="13" fill="#1b2733">keep last 10</text>
  <rect x="240" y="290" width="200" height="70" rx="10" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
  <text x="340.0" y="310.0" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a07">Path out</text>
  <text x="340.0" y="334.0" text-anchor="middle" font-size="13" fill="#1b2733">NAT, or ECR endpoints</text>
  <text x="340.0" y="354.0" text-anchor="middle" font-size="13" fill="#1b2733">+ S3 gateway</text>
  <line x1="180" y1="88" x2="240" y2="88" stroke="#3a78c2" stroke-width="2" marker-end="url(#m-blue)"/>
  <line x1="340" y1="130" x2="340" y2="170" stroke="#3a78c2" stroke-width="2" marker-end="url(#m-blue)"/>
  <line x1="440" y1="198" x2="520" y2="215" stroke="#3a78c2" stroke-width="2" marker-end="url(#m-blue)"/>
  <text x="480.0" y="198.5" text-anchor="middle" font-size="12" fill="#1b2733">port 80</text>
  <line x1="220" y1="325" x2="240" y2="325" stroke="#7a55b8" stroke-width="2" marker-end="url(#m-purple)"/>
  <line x1="440" y1="325" x2="520" y2="315" stroke="#c98a1a" stroke-width="2" marker-end="url(#m-amber)"/>
  <text x="450" y="420" text-anchor="middle" font-size="12.5" font-style="italic" fill="#2b3945">plat-api-sg accepts traffic only from plat-alb-sg. The task never has a public address.</text>
</svg>
