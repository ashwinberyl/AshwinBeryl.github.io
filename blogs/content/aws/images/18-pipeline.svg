<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="A GitHub push starts CodePipeline: source, CodeBuild builds and pushes to ECR, a manual approval, then an ECS deploy, with failure alerts">
  <rect width="900" height="420" fill="#ffffff"/>
  <defs>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e72"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24a4a"/></marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a78c2"/></marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c98a1a"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a55b8"/></marker>
  </defs>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">From push to deployed service</text>
  <rect x="20" y="105" width="110" height="80" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="75.0" y="140.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">GitHub</text>
  <text x="75.0" y="164.0" text-anchor="middle" font-size="13" fill="#1b2733">main</text>
  <rect x="165" y="70" width="570" height="150" rx="14" fill="none" stroke="#c98a1a" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="179" y="90" text-anchor="start" font-size="13" font-weight="700" fill="#6b4a07">CodePipeline plat-api-pipeline</text>
  <rect x="180" y="105" width="110" height="80" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="235.0" y="140.0" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">Source</text>
  <text x="235.0" y="164.0" text-anchor="middle" font-size="13" fill="#1b2733">connection</text>
  <rect x="310" y="105" width="120" height="80" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="370.0" y="140.0" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">Build</text>
  <text x="370.0" y="164.0" text-anchor="middle" font-size="13" fill="#1b2733">CodeBuild</text>
  <rect x="450" y="105" width="120" height="80" rx="10" fill="#efe8f8" stroke="#7a55b8" stroke-width="1.5"/>
  <text x="510.0" y="140.0" text-anchor="middle" font-size="15" font-weight="700" fill="#3f2a6b">Approve</text>
  <text x="510.0" y="164.0" text-anchor="middle" font-size="13" fill="#1b2733">manual</text>
  <rect x="590" y="105" width="130" height="80" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="655.0" y="140.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">Deploy</text>
  <text x="655.0" y="164.0" text-anchor="middle" font-size="13" fill="#1b2733">ECS standard</text>
  <line x1="130" y1="145" x2="180" y2="145" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <text x="155.0" y="135.0" text-anchor="middle" font-size="12" fill="#1b2733">push</text>
  <line x1="290" y1="145" x2="310" y2="145" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <line x1="430" y1="145" x2="450" y2="145" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <line x1="570" y1="145" x2="590" y2="145" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <rect x="760" y="105" width="120" height="80" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="820.0" y="140.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">plat-api-svc</text>
  <text x="820.0" y="164.0" text-anchor="middle" font-size="13" fill="#1b2733">rolling update</text>
  <line x1="720" y1="145" x2="760" y2="145" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <rect x="225" y="285" width="170" height="66" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="310.0" y="313.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">ECR plat/api</text>
  <text x="310.0" y="337.0" text-anchor="middle" font-size="13" fill="#1b2733">tag = commit hash</text>
  <line x1="370" y1="185" x2="335" y2="285" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <text x="330.5" y="235.0" text-anchor="middle" font-size="12" fill="#1b2733">push</text>
  <rect x="430" y="285" width="170" height="66" rx="10" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
  <text x="515.0" y="313.0" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a07">SNS plat-alerts</text>
  <text x="515.0" y="337.0" text-anchor="middle" font-size="13" fill="#1b2733">approval email</text>
  <line x1="510" y1="185" x2="515" y2="285" stroke="#7a55b8" stroke-width="2" marker-end="url(#m-purple)"/>
  <rect x="640" y="285" width="240" height="66" rx="10" fill="#fbe9e9" stroke="#c24a4a" stroke-width="1.5"/>
  <text x="760.0" y="313.0" text-anchor="middle" font-size="15" font-weight="700" fill="#7a1f1f">EventBridge rule</text>
  <text x="760.0" y="337.0" text-anchor="middle" font-size="13" fill="#1b2733">pipeline state FAILED</text>
  <line x1="640" y1="318" x2="600" y2="318" stroke="#c24a4a" stroke-width="2" marker-end="url(#m-red)"/>
  <line x1="700" y1="220" x2="740" y2="285" stroke="#c24a4a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#m-red)"/>
  <text x="450" y="395" text-anchor="middle" font-size="12.5" font-style="italic" fill="#2b3945">A failed build stops the pipeline: Approve and Deploy never run, so production keeps its version.</text>
</svg>
