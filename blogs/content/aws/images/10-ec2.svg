<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="plat-ec2 reached through Session Manager, with EBS, EFS and S3 attached and an instance role">
  <rect width="900" height="430" fill="#ffffff"/>
  <defs>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e72"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24a4a"/></marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a78c2"/></marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c98a1a"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a55b8"/></marker>
  </defs>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">A private instance and everything it connects to</text>
  <rect x="20" y="170" width="100" height="60" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="70.0" y="195.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">Jim</text>
  <text x="70.0" y="219.0" text-anchor="middle" font-size="13" fill="#1b2733">browser</text>
  <rect x="160" y="150" width="150" height="100" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="235.0" y="185.0" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">Session Manager</text>
  <text x="235.0" y="209.0" text-anchor="middle" font-size="13" fill="#1b2733">IAM-controlled</text>
  <text x="235.0" y="229.0" text-anchor="middle" font-size="13" fill="#1b2733">no inbound port</text>
  <line x1="120" y1="200" x2="160" y2="200" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <rect x="380" y="110" width="240" height="170" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="500.0" y="170.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">plat-ec2</text>
  <text x="500.0" y="194.0" text-anchor="middle" font-size="13" fill="#1b2733">t3.micro · Amazon Linux 2023</text>
  <text x="500.0" y="214.0" text-anchor="middle" font-size="13" fill="#1b2733">private subnet · plat-app-sg</text>
  <text x="500.0" y="234.0" text-anchor="middle" font-size="13" fill="#1b2733">no public IP · no key pair</text>
  <line x1="380" y1="215" x2="310" y2="215" stroke="#5b6b7a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#m-gray)"/>
  <text x="345" y="262" text-anchor="middle" font-size="12.5" font-style="italic" fill="#173d6b">agent connects out (443)</text>
  <rect x="690" y="60" width="190" height="56" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="785.0" y="83.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">EBS root 8 GiB</text>
  <text x="785.0" y="107.0" text-anchor="middle" font-size="13" fill="#1b2733">encrypted, plat-data</text>
  <rect x="690" y="130" width="190" height="56" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="785.0" y="153.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">EBS data 5 GiB</text>
  <text x="785.0" y="177.0" text-anchor="middle" font-size="13" fill="#1b2733">/data, fstab by UUID</text>
  <rect x="690" y="200" width="190" height="56" rx="10" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
  <text x="785.0" y="223.0" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a07">EFS plat-efs</text>
  <text x="785.0" y="247.0" text-anchor="middle" font-size="13" fill="#1b2733">/mnt/efs via access point</text>
  <rect x="690" y="270" width="190" height="56" rx="10" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
  <text x="785.0" y="293.0" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a07">S3 plat-data</text>
  <text x="785.0" y="317.0" text-anchor="middle" font-size="13" fill="#1b2733">via role + KMS</text>
  <line x1="620" y1="200" x2="690" y2="88" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <line x1="620" y1="200" x2="690" y2="158" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <line x1="620" y1="200" x2="690" y2="228" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <line x1="620" y1="200" x2="690" y2="298" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <rect x="380" y="330" width="240" height="66" rx="10" fill="#efe8f8" stroke="#7a55b8" stroke-width="1.5"/>
  <text x="500.0" y="348.0" text-anchor="middle" font-size="15" font-weight="700" fill="#3f2a6b">plat-ec2-role</text>
  <text x="500.0" y="372.0" text-anchor="middle" font-size="13" fill="#1b2733">instance profile</text>
  <text x="500.0" y="392.0" text-anchor="middle" font-size="13" fill="#1b2733">SSM + S3 + KMS + EFS</text>
  <line x1="500" y1="330" x2="500" y2="280" stroke="#7a55b8" stroke-width="2" marker-end="url(#m-purple)"/>
  <text x="500" y="416" text-anchor="middle" font-size="12.5" font-style="italic" fill="#2b3945">Credentials come from the metadata service (IMDSv2 token required).</text>
</svg>
