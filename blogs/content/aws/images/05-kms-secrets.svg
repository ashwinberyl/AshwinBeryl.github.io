<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="A service asks KMS for a data key; a workload reads a secret through an interface endpoint">
  <rect width="900" height="440" fill="#ffffff"/>
  <defs>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e72"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24a4a"/></marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a78c2"/></marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c98a1a"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a55b8"/></marker>
  </defs>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Envelope encryption, and a secret read through a private endpoint</text>
  <text x="30" y="66" text-anchor="start" font-size="14" font-weight="700" fill="#173d6b">Envelope encryption</text>
  <rect x="30" y="80" width="160" height="80" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="110.0" y="115.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">Service</text>
  <text x="110.0" y="139.0" text-anchor="middle" font-size="13" fill="#1b2733">S3, RDS, EBS ...</text>
  <rect x="370" y="80" width="190" height="80" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="465.0" y="115.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">KMS key</text>
  <text x="465.0" y="139.0" text-anchor="middle" font-size="13" fill="#1b2733">alias/plat-data</text>
  <line x1="190" y1="105" x2="370" y2="105" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <text x="280.0" y="97.0" text-anchor="middle" font-size="12" fill="#1b2733">1 GenerateDataKey</text>
  <line x1="370" y1="138" x2="190" y2="138" stroke="#2f9e72" stroke-width="2" marker-end="url(#m-green)"/>
  <text x="280.0" y="154.0" text-anchor="middle" font-size="12" fill="#1b2733">2 plaintext + encrypted key</text>
  <text x="30" y="196" text-anchor="start" font-size="12.5" font-style="italic" fill="#2b3945">3  Encrypt locally, then store the ciphertext and the encrypted data key together.</text>
  <text x="30" y="232" text-anchor="start" font-size="14" font-weight="700" fill="#173d6b">Secret read from a private subnet</text>
  <rect x="30" y="246" width="520" height="150" rx="14" fill="none" stroke="#3a78c2" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="266" text-anchor="start" font-size="13" font-weight="700" fill="#173d6b">VPC plat-vpc  (private subnet)</text>
  <rect x="50" y="290" width="150" height="80" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="125.0" y="325.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">plat-shell</text>
  <text x="125.0" y="349.0" text-anchor="middle" font-size="13" fill="#1b2733">sg: plat-app-sg</text>
  <rect x="310" y="290" width="220" height="80" rx="10" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
  <text x="420.0" y="315.0" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a07">Interface endpoint</text>
  <text x="420.0" y="339.0" text-anchor="middle" font-size="13" fill="#1b2733">ENI 10.20.10.x</text>
  <text x="420.0" y="359.0" text-anchor="middle" font-size="13" fill="#1b2733">sg: plat-vpce-sg</text>
  <rect x="660" y="290" width="200" height="80" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="760.0" y="325.0" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">Secrets Manager</text>
  <text x="760.0" y="349.0" text-anchor="middle" font-size="13" fill="#1b2733">plat/demo/api-key</text>
  <line x1="200" y1="330" x2="310" y2="330" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <text x="255.0" y="322.0" text-anchor="middle" font-size="12" fill="#1b2733">443</text>
  <line x1="530" y1="330" x2="660" y2="330" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <text x="595.0" y="322.0" text-anchor="middle" font-size="12" fill="#1b2733">PrivateLink</text>
  <line x1="760" y1="290" x2="520" y2="162" stroke="#2f9e72" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#m-green)"/>
  <text x="646.0" y="222.0" text-anchor="middle" font-size="12" fill="#1b2733">Decrypt</text>
  <text x="300" y="422" text-anchor="middle" font-size="12.5" font-style="italic" fill="#2b3945">Private DNS: secretsmanager.us-east-1.amazonaws.com resolves to the ENI's private IP</text>
</svg>
