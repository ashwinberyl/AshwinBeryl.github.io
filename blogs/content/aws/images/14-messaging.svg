<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="S3 publishes to SNS, SNS to SQS, SQS to Lambda to DynamoDB, failed messages go to a dead-letter queue, and alerts flow to a second topic">
  <rect width="900" height="450" fill="#ffffff"/>
  <defs>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e72"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24a4a"/></marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a78c2"/></marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c98a1a"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a55b8"/></marker>
  </defs>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">The ingest flow with SNS, SQS, a DLQ and EventBridge</text>
  <rect x="20" y="62" width="120" height="70" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="80.0" y="92.0" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">S3</text>
  <text x="80.0" y="116.0" text-anchor="middle" font-size="13" fill="#1b2733">raw/*.csv</text>
  <rect x="190" y="62" width="120" height="70" rx="10" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
  <text x="250.0" y="92.0" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a07">SNS</text>
  <text x="250.0" y="116.0" text-anchor="middle" font-size="13" fill="#1b2733">plat-uploads</text>
  <rect x="360" y="62" width="160" height="70" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="440.0" y="92.0" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">SQS</text>
  <text x="440.0" y="116.0" text-anchor="middle" font-size="13" fill="#1b2733">plat-ingest-queue</text>
  <rect x="560" y="62" width="130" height="70" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="625.0" y="92.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">Lambda</text>
  <text x="625.0" y="116.0" text-anchor="middle" font-size="13" fill="#1b2733">plat-ingest</text>
  <rect x="760" y="62" width="120" height="70" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="820.0" y="92.0" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">DynamoDB</text>
  <text x="820.0" y="116.0" text-anchor="middle" font-size="13" fill="#1b2733">plat-jobs</text>
  <line x1="140" y1="97" x2="190" y2="97" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <line x1="310" y1="97" x2="360" y2="97" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <line x1="520" y1="97" x2="560" y2="97" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <line x1="690" y1="97" x2="760" y2="97" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <rect x="360" y="175" width="160" height="60" rx="10" fill="#fbe9e9" stroke="#c24a4a" stroke-width="1.5"/>
  <text x="440.0" y="200.0" text-anchor="middle" font-size="15" font-weight="700" fill="#7a1f1f">plat-ingest-dlq</text>
  <text x="440.0" y="224.0" text-anchor="middle" font-size="13" fill="#1b2733">14 days retention</text>
  <line x1="440" y1="132" x2="440" y2="175" stroke="#c24a4a" stroke-width="2" marker-end="url(#m-red)"/>
  <text x="510.0" y="155.5" text-anchor="middle" font-size="12" fill="#1b2733">3 failed receives</text>
  <text x="450" y="275" text-anchor="middle" font-size="14" font-weight="700" fill="#6b4a07">Alerts and schedules</text>
  <rect x="20" y="290" width="200" height="44" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="120.0" y="317.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">EventBridge rules</text>
  <rect x="20" y="346" width="200" height="44" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="120.0" y="373.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">CloudWatch alarms</text>
  <rect x="20" y="402" width="200" height="36" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="120.0" y="425.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">Budgets</text>
  <rect x="330" y="322" width="190" height="70" rx="10" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
  <text x="425.0" y="352.0" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a07">SNS plat-alerts</text>
  <text x="425.0" y="376.0" text-anchor="middle" font-size="13" fill="#1b2733">email subscription</text>
  <line x1="220" y1="312" x2="330" y2="357" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <line x1="220" y1="368" x2="330" y2="357" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <line x1="220" y1="420" x2="330" y2="357" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <rect x="600" y="322" width="140" height="70" rx="10" fill="#efe8f8" stroke="#7a55b8" stroke-width="1.5"/>
  <text x="670.0" y="362.0" text-anchor="middle" font-size="15" font-weight="700" fill="#3f2a6b">Your inbox</text>
  <line x1="520" y1="357" x2="600" y2="357" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <rect x="770" y="322" width="110" height="70" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="825.0" y="352.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">plat-report</text>
  <text x="825.0" y="376.0" text-anchor="middle" font-size="13" fill="#1b2733">scheduled</text>
</svg>
