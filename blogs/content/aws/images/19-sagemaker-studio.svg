<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Dave works in a SageMaker Studio space, which starts a processing job that runs the plat/ml image against data in S3">
  <rect width="900" height="440" fill="#ffffff"/>
  <defs>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e72"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24a4a"/></marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a78c2"/></marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c98a1a"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a55b8"/></marker>
  </defs>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Studio, ECR, S3 and a processing job</text>
  <rect x="20" y="95" width="110" height="70" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="75.0" y="125.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">Dave</text>
  <text x="75.0" y="149.0" text-anchor="middle" font-size="13" fill="#1b2733">Identity Center</text>
  <rect x="165" y="60" width="300" height="210" rx="14" fill="none" stroke="#3a78c2" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="179" y="80" text-anchor="start" font-size="13" font-weight="700" fill="#173d6b">Domain plat-studio (VPC only)</text>
  <rect x="185" y="92" width="260" height="76" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="315.0" y="115.0" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">JupyterLab space</text>
  <text x="315.0" y="139.0" text-anchor="middle" font-size="13" fill="#1b2733">ml.t3.medium</text>
  <text x="315.0" y="159.0" text-anchor="middle" font-size="13" fill="#1b2733">conda env plat-ml</text>
  <rect x="185" y="184" width="260" height="64" rx="10" fill="#efe8f8" stroke="#7a55b8" stroke-width="1.5"/>
  <text x="315.0" y="211.0" text-anchor="middle" font-size="15" font-weight="700" fill="#3f2a6b">plat-sm-role</text>
  <text x="315.0" y="235.0" text-anchor="middle" font-size="13" fill="#1b2733">execution role for code and jobs</text>
  <line x1="130" y1="130" x2="185" y2="130" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <rect x="530" y="60" width="350" height="210" rx="14" fill="none" stroke="#2f9e72" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="544" y="80" text-anchor="start" font-size="13" font-weight="700" fill="#124d38">Processing job (managed instance)</text>
  <rect x="550" y="92" width="310" height="76" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="705.0" y="115.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">plat/ml:1.0 · preprocess.py</text>
  <text x="705.0" y="139.0" text-anchor="middle" font-size="13" fill="#1b2733">ml.m5.large · 10 GB</text>
  <text x="705.0" y="159.0" text-anchor="middle" font-size="13" fill="#1b2733">private subnets, NAT + S3 endpoint</text>
  <line x1="445" y1="130" x2="550" y2="130" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <text x="497.5" y="120.0" text-anchor="middle" font-size="12" fill="#1b2733">API call</text>
  <text x="705" y="205" text-anchor="middle" font-size="12.5" font-style="italic" fill="#124d38">reads /opt/ml/processing/input</text>
  <text x="705" y="225" text-anchor="middle" font-size="12.5" font-style="italic" fill="#124d38">writes train/ and validation/</text>
  <rect x="310" y="340" width="280" height="76" rx="10" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
  <text x="450.0" y="363.0" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a07">S3 plat-data</text>
  <text x="450.0" y="387.0" text-anchor="middle" font-size="13" fill="#1b2733">raw/events.csv</text>
  <text x="450.0" y="407.0" text-anchor="middle" font-size="13" fill="#1b2733">processed/train, validation</text>
  <line x1="620" y1="270" x2="520" y2="340" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <text x="536.0" y="305.0" text-anchor="middle" font-size="12" fill="#1b2733">read, write</text>
  <rect x="680" y="340" width="200" height="76" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="780.0" y="373.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">ECR plat/ml</text>
  <text x="780.0" y="397.0" text-anchor="middle" font-size="13" fill="#1b2733">image 1.0</text>
  <line x1="780" y1="340" x2="780" y2="270" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <text x="824.0" y="309.0" text-anchor="middle" font-size="12" fill="#1b2733">image pull</text>
</svg>
