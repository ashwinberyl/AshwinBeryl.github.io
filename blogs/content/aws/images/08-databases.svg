<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="RDS PostgreSQL in private subnets with a managed secret, and a DynamoDB jobs table reached through a gateway endpoint">
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e72"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24a4a"/></marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a78c2"/></marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c98a1a"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a55b8"/></marker>
  </defs>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">The Platform Lab's two databases</text>
  <rect x="30" y="140" width="180" height="80" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="120.0" y="165.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">Client</text>
  <text x="120.0" y="189.0" text-anchor="middle" font-size="13" fill="#1b2733">plat-shell / API</text>
  <text x="120.0" y="209.0" text-anchor="middle" font-size="13" fill="#1b2733">sg: plat-app-sg</text>
  <rect x="310" y="60" width="220" height="90" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="420.0" y="80.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">RDS plat-meta</text>
  <text x="420.0" y="104.0" text-anchor="middle" font-size="13" fill="#1b2733">PostgreSQL, private</text>
  <text x="420.0" y="124.0" text-anchor="middle" font-size="13" fill="#1b2733">sg: plat-rds-sg (5432)</text>
  <text x="420.0" y="144.0" text-anchor="middle" font-size="13" fill="#1b2733">storage: KMS plat-data</text>
  <rect x="310" y="168" width="220" height="78" rx="10" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
  <text x="420.0" y="192.0" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a07">Managed secret</text>
  <text x="420.0" y="216.0" text-anchor="middle" font-size="13" fill="#1b2733">rds!db-...</text>
  <text x="420.0" y="236.0" text-anchor="middle" font-size="13" fill="#1b2733">rotates every 7 days</text>
  <rect x="310" y="300" width="220" height="60" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="420.0" y="325.0" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">Gateway endpoint</text>
  <text x="420.0" y="349.0" text-anchor="middle" font-size="13" fill="#1b2733">route-table entry, free</text>
  <rect x="650" y="60" width="230" height="140" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="765.0" y="105.0" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">DynamoDB plat-jobs</text>
  <text x="765.0" y="129.0" text-anchor="middle" font-size="13" fill="#1b2733">PK job_id</text>
  <text x="765.0" y="149.0" text-anchor="middle" font-size="13" fill="#1b2733">GSI status-created_idx</text>
  <text x="765.0" y="169.0" text-anchor="middle" font-size="13" fill="#1b2733">on-demand · KMS · TTL</text>
  <line x1="210" y1="165" x2="310" y2="108" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <text x="254.0" y="128.5" text-anchor="middle" font-size="12" fill="#1b2733">5432</text>
  <line x1="210" y1="195" x2="310" y2="207" stroke="#c98a1a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#m-amber)"/>
  <text x="260.0" y="193.0" text-anchor="middle" font-size="12" fill="#1b2733">password</text>
  <line x1="160" y1="220" x2="310" y2="325" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <line x1="530" y1="325" x2="700" y2="200" stroke="#3a78c2" stroke-width="2" marker-end="url(#m-blue)"/>
  <text x="651.0" y="262.5" text-anchor="middle" font-size="12" fill="#1b2733">to DynamoDB</text>
  <text x="450" y="388" text-anchor="middle" font-size="12.5" font-style="italic" fill="#2b3945">RDS lives inside the VPC. DynamoDB is a regional service reached privately through the endpoint.</text>
</svg>
