<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="EKS control plane outside the VPC, managed nodes and pods inside, with Pod Identity giving pods an IAM role">
  <rect width="900" height="440" fill="#ffffff"/>
  <defs>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e72"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24a4a"/></marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a78c2"/></marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c98a1a"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a55b8"/></marker>
  </defs>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">EKS: control plane, nodes and the identity paths</text>
  <rect x="20" y="60" width="300" height="170" rx="14" fill="none" stroke="#3a78c2" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="34" y="80" text-anchor="start" font-size="13" font-weight="700" fill="#173d6b">AWS-managed control plane</text>
  <rect x="40" y="95" width="260" height="110" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="170.0" y="125.0" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">plat-eks</text>
  <text x="170.0" y="149.0" text-anchor="middle" font-size="13" fill="#1b2733">API server + etcd</text>
  <text x="170.0" y="169.0" text-anchor="middle" font-size="13" fill="#1b2733">multi-AZ</text>
  <text x="170.0" y="189.0" text-anchor="middle" font-size="13" fill="#1b2733">endpoint: public + private</text>
  <rect x="20" y="290" width="160" height="70" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="100.0" y="310.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">Jim · kubectl</text>
  <text x="100.0" y="334.0" text-anchor="middle" font-size="13" fill="#1b2733">IAM token</text>
  <text x="100.0" y="354.0" text-anchor="middle" font-size="13" fill="#1b2733">access entry</text>
  <line x1="100" y1="290" x2="100" y2="205" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <text x="148.0" y="247.5" text-anchor="middle" font-size="12" fill="#1b2733">authenticates</text>
  <rect x="360" y="60" width="520" height="330" rx="14" fill="none" stroke="#8a97a3" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="374" y="80" text-anchor="start" font-size="13" font-weight="700" fill="#2b3945">plat-vpc, private subnets</text>
  <rect x="380" y="100" width="230" height="100" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="495.0" y="135.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">Managed node group</text>
  <text x="495.0" y="159.0" text-anchor="middle" font-size="13" fill="#1b2733">2 x t3.medium</text>
  <text x="495.0" y="179.0" text-anchor="middle" font-size="13" fill="#1b2733">node role: join + ECR pull</text>
  <rect x="640" y="100" width="220" height="100" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="750.0" y="135.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">Pods plat-api x2</text>
  <text x="750.0" y="159.0" text-anchor="middle" font-size="13" fill="#1b2733">ServiceAccount plat-api</text>
  <text x="750.0" y="179.0" text-anchor="middle" font-size="13" fill="#1b2733">namespace plat</text>
  <line x1="300" y1="150" x2="380" y2="150" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <text x="340.0" y="140.0" text-anchor="middle" font-size="12" fill="#1b2733">kubelet</text>
  <line x1="610" y1="150" x2="640" y2="150" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <rect x="380" y="250" width="230" height="70" rx="10" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
  <text x="495.0" y="280.0" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a07">Pod Identity Agent</text>
  <text x="495.0" y="304.0" text-anchor="middle" font-size="13" fill="#1b2733">DaemonSet on each node</text>
  <rect x="640" y="250" width="220" height="70" rx="10" fill="#efe8f8" stroke="#7a55b8" stroke-width="1.5"/>
  <text x="750.0" y="280.0" text-anchor="middle" font-size="15" font-weight="700" fill="#3f2a6b">plat-eks-pod-role</text>
  <text x="750.0" y="304.0" text-anchor="middle" font-size="13" fill="#1b2733">S3, DynamoDB, secret</text>
  <line x1="610" y1="285" x2="640" y2="285" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <text x="625.0" y="277.0" text-anchor="middle" font-size="12" fill="#1b2733">assume</text>
  <line x1="750" y1="200" x2="750" y2="250" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <text x="796.0" y="225.0" text-anchor="middle" font-size="12" fill="#1b2733">credentials</text>
  <text x="620" y="365" text-anchor="middle" font-size="12.5" font-style="italic" fill="#2b3945">Service type LoadBalancer creates a load balancer in the tagged public subnets.</text>
</svg>
