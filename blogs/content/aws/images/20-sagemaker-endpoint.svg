<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="A training job writes model.tar.gz to S3, an endpoint serves it, and plat-api calls the endpoint behind the load balancer">
  <rect width="900" height="440" fill="#ffffff"/>
  <defs>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e72"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24a4a"/></marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a78c2"/></marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c98a1a"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a55b8"/></marker>
  </defs>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Training, model artifact, endpoint, and the API that calls it</text>
  <rect x="20" y="70" width="120" height="76" rx="10" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
  <text x="80.0" y="93.0" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a07">S3</text>
  <text x="80.0" y="117.0" text-anchor="middle" font-size="13" fill="#1b2733">processed/</text>
  <text x="80.0" y="137.0" text-anchor="middle" font-size="13" fill="#1b2733">train + val</text>
  <rect x="210" y="70" width="130" height="76" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="275.0" y="93.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">Training job</text>
  <text x="275.0" y="117.0" text-anchor="middle" font-size="13" fill="#1b2733">plat/ml:1.1</text>
  <text x="275.0" y="137.0" text-anchor="middle" font-size="13" fill="#1b2733">train</text>
  <rect x="410" y="70" width="130" height="76" rx="10" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
  <text x="475.0" y="103.0" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a07">S3 models/</text>
  <text x="475.0" y="127.0" text-anchor="middle" font-size="13" fill="#1b2733">model.tar.gz</text>
  <rect x="610" y="70" width="150" height="76" rx="10" fill="#efe8f8" stroke="#7a55b8" stroke-width="1.5"/>
  <text x="685.0" y="93.0" text-anchor="middle" font-size="15" font-weight="700" fill="#3f2a6b">Endpoint</text>
  <text x="685.0" y="117.0" text-anchor="middle" font-size="13" fill="#1b2733">plat-churn</text>
  <text x="685.0" y="137.0" text-anchor="middle" font-size="13" fill="#1b2733">serve on :8080</text>
  <line x1="140" y1="108" x2="210" y2="108" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <text x="175.0" y="100.0" text-anchor="middle" font-size="12" fill="#1b2733">csv</text>
  <line x1="340" y1="108" x2="410" y2="108" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <text x="375.0" y="100.0" text-anchor="middle" font-size="12" fill="#1b2733">artifact</text>
  <line x1="540" y1="108" x2="610" y2="108" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <text x="575.0" y="100.0" text-anchor="middle" font-size="12" fill="#1b2733">loaded</text>
  <rect x="210" y="250" width="130" height="60" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="275.0" y="275.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">Client</text>
  <text x="275.0" y="299.0" text-anchor="middle" font-size="13" fill="#1b2733">curl</text>
  <rect x="410" y="250" width="130" height="60" rx="10" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
  <text x="475.0" y="275.0" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a07">plat-alb</text>
  <text x="475.0" y="299.0" text-anchor="middle" font-size="13" fill="#1b2733">HTTP :80</text>
  <rect x="610" y="250" width="150" height="60" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="685.0" y="275.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">plat-api task</text>
  <text x="685.0" y="299.0" text-anchor="middle" font-size="13" fill="#1b2733">/predict</text>
  <line x1="340" y1="280" x2="410" y2="280" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <line x1="540" y1="280" x2="610" y2="280" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <line x1="685" y1="250" x2="685" y2="146" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <text x="747.0" y="198.0" text-anchor="middle" font-size="12" fill="#1b2733">InvokeEndpoint</text>
  <rect x="610" y="345" width="150" height="52" rx="10" fill="#efe8f8" stroke="#7a55b8" stroke-width="1.5"/>
  <text x="685.0" y="366.0" text-anchor="middle" font-size="15" font-weight="700" fill="#3f2a6b">Task role</text>
  <text x="685.0" y="390.0" text-anchor="middle" font-size="13" fill="#1b2733">sagemaker:InvokeEndpoint</text>
  <text x="450" y="425" text-anchor="middle" font-size="12.5" font-style="italic" fill="#7a1f1f">A real-time endpoint bills every hour it exists. Delete it when you are not using it.</text>
</svg>
