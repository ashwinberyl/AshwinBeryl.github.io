  <line x1="140" y1="310" x2="300" y2="350" stroke="#c24a4a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#m-red)"/>
  <text x="220.0" y="320.0" text-anchor="middle" font-size="12" fill="#1b2733">AccessDenied</text>
