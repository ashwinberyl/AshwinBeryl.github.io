<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Jim publishes a product in a portfolio with a launch role, Dave launches it without S3 permissions, and a direct create is denied">
