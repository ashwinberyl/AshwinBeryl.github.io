  <line x1="490" y1="108" x2="560" y2="108" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <text x="525.0" y="98.0" text-anchor="middle" font-size="12" fill="#1b2733">assumes</text>
  <line x1="710" y1="108" x2="740" y2="108" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <line x1="810" y1="146" x2="810" y2="210" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <rect x="300" y="330" width="240" height="60" rx="10" fill="#fbe9e9" stroke="#c24a4a" stroke-width="1.5"/>
  <text x="420.0" y="355.0" text-anchor="middle" font-size="15" font-weight="700" fill="#7a1f1f">Direct CreateBucket</text>
