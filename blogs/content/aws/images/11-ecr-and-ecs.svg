<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="An application load balancer in public subnets forwards to two Fargate tasks in private subnets that pull from ECR and call AWS services with a task role">
  <rect width="900" height="440" fill="#ffffff"/>
  <defs>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e72"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24a4a"/></marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a78c2"/></marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c98a1a"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a55b8"/></marker>
  </defs>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">ECR, ECS and the load balancer</text>
  <rect x="20" y="160" width="100" height="60" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="70.0" y="195.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">Internet</text>
  <rect x="160" y="140" width="150" height="100" rx="10" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
  <text x="235.0" y="175.0" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a07">plat-alb</text>
  <text x="235.0" y="199.0" text-anchor="middle" font-size="13" fill="#1b2733">HTTP :80</text>
  <text x="235.0" y="219.0" text-anchor="middle" font-size="13" fill="#1b2733">plat-alb-sg</text>
  <line x1="120" y1="190" x2="160" y2="190" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <rect x="360" y="90" width="300" height="230" rx="14" fill="none" stroke="#8a97a3" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="374" y="110" text-anchor="start" font-size="13" font-weight="700" fill="#2b3945">Fargate service plat-api-svc</text>
  <rect x="380" y="125" width="120" height="76" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="440.0" y="158.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">task 1</text>
  <text x="440.0" y="182.0" text-anchor="middle" font-size="13" fill="#1b2733">8080 · plat-app-sg</text>
  <rect x="520" y="125" width="120" height="76" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="580.0" y="158.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">task 2</text>
  <text x="580.0" y="182.0" text-anchor="middle" font-size="13" fill="#1b2733">8080 · plat-app-sg</text>
  <line x1="310" y1="190" x2="360" y2="190" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <text x="335.0" y="180.0" text-anchor="middle" font-size="12" fill="#1b2733">target group</text>
  <text x="510" y="232" text-anchor="middle" font-size="12.5" font-style="italic" fill="#3f2a6b">task role: what the code may do</text>
  <text x="510" y="250" text-anchor="middle" font-size="12.5" font-style="italic" fill="#3f2a6b">execution role: pull image, write logs</text>
  <rect x="700" y="70" width="180" height="56" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="790.0" y="93.0" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">S3</text>
  <text x="790.0" y="117.0" text-anchor="middle" font-size="13" fill="#1b2733">raw/ via KMS</text>
  <rect x="700" y="150" width="180" height="56" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="790.0" y="173.0" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">DynamoDB</text>
  <text x="790.0" y="197.0" text-anchor="middle" font-size="13" fill="#1b2733">plat-jobs</text>
  <rect x="700" y="230" width="180" height="56" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="790.0" y="253.0" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">RDS + Secrets</text>
  <text x="790.0" y="277.0" text-anchor="middle" font-size="13" fill="#1b2733">datasets</text>
  <line x1="660" y1="190" x2="700" y2="98" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <line x1="660" y1="190" x2="700" y2="178" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <line x1="660" y1="190" x2="700" y2="258" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <rect x="380" y="350" width="260" height="60" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="510.0" y="375.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">ECR plat/api</text>
  <text x="510.0" y="399.0" text-anchor="middle" font-size="13" fill="#1b2733">image tagged by commit</text>
  <line x1="510" y1="350" x2="510" y2="320" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <text x="536.0" y="337.0" text-anchor="middle" font-size="12" fill="#1b2733">pull</text>
  <rect x="160" y="350" width="160" height="60" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="240.0" y="375.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">CloudWatch Logs</text>
  <text x="240.0" y="399.0" text-anchor="middle" font-size="13" fill="#1b2733">/ecs/plat-api</text>
  <line x1="380" y1="300" x2="320" y2="350" stroke="#5b6b7a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#m-gray)"/>
</svg>
