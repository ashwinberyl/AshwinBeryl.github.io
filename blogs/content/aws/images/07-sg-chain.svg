<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Security groups reference each other: ALB to API tasks to RDS, EFS and endpoints">
  <rect width="900" height="430" fill="#ffffff"/>
  <defs>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e72"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24a4a"/></marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a78c2"/></marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c98a1a"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a55b8"/></marker>
  </defs>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Each tier accepts traffic only from the tier in front</text>
  <rect x="20" y="80" width="110" height="90" rx="10" fill="#eef1f4" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="75.0" y="130.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3945">Internet</text>
  <rect x="170" y="80" width="175" height="90" rx="10" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
  <text x="257.5" y="110.0" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a07">ALB</text>
  <text x="257.5" y="134.0" text-anchor="middle" font-size="13" fill="#1b2733">plat-alb-sg</text>
  <text x="257.5" y="154.0" text-anchor="middle" font-size="13" fill="#1b2733">in: 80 from anyone</text>
  <rect x="380" y="80" width="190" height="90" rx="10" fill="#e3edf9" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="475.0" y="110.0" text-anchor="middle" font-size="15" font-weight="700" fill="#173d6b">ECS tasks</text>
  <text x="475.0" y="134.0" text-anchor="middle" font-size="13" fill="#1b2733">plat-api-sg + plat-app-sg</text>
  <text x="475.0" y="154.0" text-anchor="middle" font-size="13" fill="#1b2733">in: 8080 from alb-sg</text>
  <line x1="130" y1="125" x2="170" y2="125" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <text x="150.0" y="117.0" text-anchor="middle" font-size="12" fill="#1b2733">80</text>
  <line x1="345" y1="125" x2="380" y2="125" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <text x="362.5" y="117.0" text-anchor="middle" font-size="12" fill="#1b2733">8080</text>
  <rect x="170" y="255" width="190" height="100" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="265.0" y="280.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">RDS</text>
  <text x="265.0" y="304.0" text-anchor="middle" font-size="13" fill="#1b2733">plat-rds-sg</text>
  <text x="265.0" y="324.0" text-anchor="middle" font-size="13" fill="#1b2733">in: 5432 from</text>
  <text x="265.0" y="344.0" text-anchor="middle" font-size="13" fill="#1b2733">plat-app-sg</text>
  <rect x="390" y="255" width="190" height="100" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="485.0" y="280.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">EFS</text>
  <text x="485.0" y="304.0" text-anchor="middle" font-size="13" fill="#1b2733">plat-efs-sg</text>
  <text x="485.0" y="324.0" text-anchor="middle" font-size="13" fill="#1b2733">in: 2049 from</text>
  <text x="485.0" y="344.0" text-anchor="middle" font-size="13" fill="#1b2733">plat-app-sg</text>
  <rect x="610" y="255" width="190" height="100" rx="10" fill="#dff3ea" stroke="#2f9e72" stroke-width="1.5"/>
  <text x="705.0" y="280.0" text-anchor="middle" font-size="15" font-weight="700" fill="#124d38">Endpoints</text>
  <text x="705.0" y="304.0" text-anchor="middle" font-size="13" fill="#1b2733">plat-vpce-sg</text>
  <text x="705.0" y="324.0" text-anchor="middle" font-size="13" fill="#1b2733">in: 443 from</text>
  <text x="705.0" y="344.0" text-anchor="middle" font-size="13" fill="#1b2733">plat-app-sg</text>
  <line x1="430" y1="170" x2="290" y2="255" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <text x="346.0" y="212.5" text-anchor="middle" font-size="12" fill="#1b2733">5432</text>
  <line x1="475" y1="170" x2="485" y2="255" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <text x="494.0" y="212.5" text-anchor="middle" font-size="12" fill="#1b2733">2049</text>
  <line x1="520" y1="170" x2="700" y2="255" stroke="#5b6b7a" stroke-width="2" marker-end="url(#m-gray)"/>
  <text x="624.0" y="212.5" text-anchor="middle" font-size="12" fill="#1b2733">443</text>
  <text x="450" y="395" text-anchor="middle" font-size="12.5" font-style="italic" fill="#2b3945">Rules point at groups, not IP addresses, so scaling and replacement need no rule edits.</text>
</svg>
