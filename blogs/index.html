<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Blog — Ashwin Kalaichandran | DevSecOps, Platform Engineering, Kubernetes, AWS, CI/CD insights and tutorials.">
    <title>Ashwin Blogs</title>
    <link rel="stylesheet" href="../style.css?v=2">
    <link rel="stylesheet" href="blog.css?v=8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">
    <!-- Markdown parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Syntax highlighting -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css"
        id="hljs-dark-theme">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css"
        id="hljs-light-theme">
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>

<body>
    <!-- Scroll Progress -->
    <div id="progress-bar"></div>

    <!-- Navigation -->
    <nav id="nav">
        <div class="nav-inner">
            <div style="display: flex; align-items: center; gap: 0.8rem;">
                <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle blog sidebar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
                        class="sidebar-toggle-icon">
                        <line x1="4" y1="12" x2="20" y2="12" />
                        <line x1="4" y1="6" x2="20" y2="6" />
                        <line x1="4" y1="18" x2="20" y2="18" />
                    </svg>
                </button>
                <a href="../" class="blog-home-link" title="Home" aria-label="Go to homepage">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2.5 10.5L12 2.5l9.5 8" />
                        <path d="M5 8.5V21h4v-6a3 3 0 0 1 6 0v6h4V8.5" />
                    </svg>
                </a>
            </div>
            <div class="nav-links" style="gap: 0.8rem;">
                <a href="../#projects" class="blog-work-link">View My Work</a>
                <button id="theme-toggle" aria-label="Toggle theme" title="Toggle light/dark mode">
                    <span class="icon-sun">☀️</span>
                    <span class="icon-moon">🌙</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Blog Layout -->
    <main class="blog-layout">
        <!-- Sidebar toggle moved to header -->

        <!-- Sidebar -->
        <aside class="blog-sidebar" id="blog-sidebar">
            <div class="sidebar-header">
                <h2>Blog</h2>
                <div class="sidebar-search">
                    <input type="text" id="search-input" placeholder="Search posts..." aria-label="Search blog posts">
                    <span class="search-icon">⌕</span>
                </div>
            </div>
            <nav class="sidebar-tree" id="sidebar-tree" aria-label="Blog navigation">
                <!-- Dynamically populated by blog.js -->
            </nav>
        </aside>

        <!-- Content area -->
        <div class="blog-content" id="blog-content">
            <!-- Welcome / landing state -->
            <div class="blog-welcome" id="blog-welcome">
                <div class="welcome-icon">📖</div>
                <h1>Welcome to <span class="gradient-text">my Blog</span></h1>
                <p>Thoughts on DevSecOps, platform engineering, cloud infrastructure, and everything I learn along the
                    way.</p>
                <p class="welcome-hint">← Select a post from the sidebar to start reading.</p>
            </div>

            <!-- Article (hidden until a post is selected) -->
            <article class="blog-article" id="blog-article" style="display:none;">
                <div class="article-breadcrumb" id="article-breadcrumb"></div>
                <div class="article-meta" id="article-meta"></div>
                <div class="article-body" id="article-body"></div>
            </article>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container footer-inner">
            <span>© 2026 Ashwin Kalaichandran</span>
            <span>Built with precision.</span>
        </div>
    </footer>

    <script src="blog.js"></script>
</body>

</html>
